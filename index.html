<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trajet">
<title>Trajet — Un Trajet partagé, des économies assurées</title>
<meta name="description" content="Covoiturage et moto en Côte d’Ivoire. Un Trajet partagé, des économies assurées.">
<link rel="preconnect" href="https://fokibiczyrdbovnwoflu.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
:root{
  --bg:#000;--s1:#171a20;--s2:#23262c;--s3:#33373e;--ink:#f4f4f4;--mut:#8e9196;--line:rgba(255,255,255,.1);
  --acc:#3e6ae1;--cta:#f4f4f4;--cta-ink:#171a20;--danger:#e5484d;--dangersoft:rgba(229,72,77,.14);
  --ok:#3ecf8e;--oksoft:rgba(62,207,142,.14);--warn:#f0b429;--warnsoft:rgba(240,180,41,.14);
  --sheet:rgba(23,26,32,.92);--shadow:0 -12px 40px rgba(0,0,0,.55);
  --navh:calc(62px + env(safe-area-inset-bottom,0px));
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#fff;--s1:#f4f4f4;--s2:#eaeaea;--s3:#dcdcdc;--ink:#171a20;--mut:#5c5e62;--line:rgba(23,26,32,.1);
  --cta:#171a20;--cta-ink:#fff;--danger:#d12b30;--dangersoft:rgba(209,43,48,.1);
  --ok:#0a7d4f;--oksoft:rgba(10,125,79,.1);--warn:#8a5d00;--warnsoft:rgba(138,93,0,.1);
  --sheet:rgba(255,255,255,.94);--shadow:0 -12px 40px rgba(0,0,0,.14);color-scheme:light;
}
@media (prefers-color-scheme:light){
  :root[data-theme="auto"]{
    --bg:#fff;--s1:#f4f4f4;--s2:#eaeaea;--s3:#dcdcdc;--ink:#171a20;--mut:#5c5e62;--line:rgba(23,26,32,.1);
    --cta:#171a20;--cta-ink:#fff;--danger:#d12b30;--dangersoft:rgba(209,43,48,.1);
    --ok:#0a7d4f;--oksoft:rgba(10,125,79,.1);--warn:#8a5d00;--warnsoft:rgba(138,93,0,.1);
    --sheet:rgba(255,255,255,.94);--shadow:0 -12px 40px rgba(0,0,0,.14);color-scheme:light;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
small{font-size:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
.app.pad{padding-bottom:calc(var(--navh) + 24px)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Splash */
.splash{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg)}
.wm{font-weight:600;letter-spacing:.34em;font-size:15px;text-transform:uppercase;user-select:none}
.wm.lg{font-size:22px;letter-spacing:.4em}
.splash .wm{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* Header */
header{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 12px;background:linear-gradient(var(--bg) 70%,transparent)}
header .hr{display:flex;align-items:center;gap:10px}
.role{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.fb{position:relative;display:grid;place-items:center;width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;background:var(--sheet);color:var(--ink);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:visible}
.fb .av{width:100%;height:100%}
.fb i{position:absolute;top:-3px;right:-3px;background:var(--acc);color:#fff;font:600 10.5px/17px Inter,sans-serif;min-width:17px;border-radius:99px;font-style:normal;padding:0 4px;text-align:center}
.backb{display:flex;align-items:center;gap:6px;background:none;padding:0;min-height:44px;color:var(--ink);font-weight:500}

/* Nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--sheet);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav div{max-width:480px;margin:0 auto;display:flex}
nav button{flex:1;background:transparent;font-size:10.5px;font-weight:500;letter-spacing:.04em;padding:6px 4px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:50px;border-radius:12px}
nav button.on{color:var(--ink)}
nav button.on svg{stroke-width:2.1}

/* Layout */
main{padding:6px 20px 0}
main.bleed{padding:0}
h1{font-size:30px;font-weight:500;margin:6px 0 4px;letter-spacing:-.03em;line-height:1.1}
h2{font-size:12px;font-weight:500;margin:28px 0 10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
p.sub{color:var(--mut);margin:0 0 18px;font-size:14px}
.eyebrow{font-size:11.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.card{background:var(--s1);border-radius:18px;padding:18px;margin-bottom:12px}
.route{font-size:18px;font-weight:500;letter-spacing:-.015em}
.meta{color:var(--mut);font-size:13.5px;margin:4px 0 10px}
.price{font-weight:500;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.02em}
.price small,.tp small{color:var(--mut);font-size:11px;font-weight:400;letter-spacing:.06em;margin-left:3px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.rl{justify-content:flex-start}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:4px 10px;border-radius:99px;background:var(--s2);color:var(--mut);margin:0 4px 4px 0;white-space:nowrap}
.b-ok{background:var(--oksoft);color:var(--ok)}.b-wait{background:var(--warnsoft);color:var(--warn)}.b-red{background:var(--dangersoft);color:var(--danger)}

/* Buttons */
button{font:inherit;font-weight:500;border:0;border-radius:99px;padding:0 20px;cursor:pointer;background:var(--s2);color:var(--ink);min-height:48px;transition:transform .12s,opacity .15s,background .15s}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--cta);color:var(--cta-ink)}
button.ok{background:var(--acc);color:#fff}
button.out{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
button.full{width:100%}
.btns{display:flex;gap:10px;margin-top:12px}.btns>button{flex:1}
.link{background:none;color:var(--mut);padding:6px 0;min-height:0;font-size:14px;border-radius:0}
a{color:var(--ink)}
.sos{position:relative;overflow:hidden;width:100%;background:var(--dangersoft);color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.sos .fill{position:absolute;inset:0;background:var(--danger);transform:scaleX(0);transform-origin:left}
.sos span{position:relative}
.sos.go .fill{transform:scaleX(1);transition:transform 1.2s linear}
.sos.go{color:#fff}

/* Forms */
label{display:block;font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:16px 0 6px}
input,select,textarea{width:100%;min-width:0;font:inherit;padding:14px 16px;border-radius:14px;border:1px solid transparent;background:var(--s1);color:var(--ink);transition:border-color .15s}
input::placeholder,textarea::placeholder{color:var(--mut);opacity:.7}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--acc)}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;max-width:100%;min-height:50px;display:block}
.swap-wrap{position:relative}
.swap-btn{position:absolute;right:8px;top:50%;margin-top:-18px;width:36px;height:36px;min-height:36px;padding:0;background:var(--s3);display:grid;place-items:center}
.seg{display:flex;gap:4px;background:var(--s1);padding:4px;border-radius:99px;overflow-x:auto}
.seg button{flex:1;background:transparent;padding:0 12px;min-height:40px;white-space:nowrap;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--s3);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:0 16px;min-height:38px;font-size:13.5px;background:var(--s1)}
.chips button.on{background:var(--cta);color:var(--cta-ink)}
.tel{display:flex;gap:8px}.tel b{background:var(--s1);border-radius:14px;padding:0 14px;display:grid;place-items:center;font-weight:500}
.chk{display:flex;gap:12px;align-items:center;margin:16px 0}.chk label{margin:0;font-weight:400;font-size:13.5px;letter-spacing:0;text-transform:none;color:var(--mut)}
.up{position:relative;overflow:hidden;display:inline-block;flex:none}.up input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;padding:0}.up span{display:inline-block;background:var(--s3);padding:10px 16px;border-radius:99px;font-weight:500;font-size:13.5px}

/* Misc blocks */
.empty{border:1px dashed var(--line);border-radius:18px;padding:28px 18px;text-align:center;color:var(--mut);font-size:14.5px}
.note{background:var(--warnsoft);color:var(--warn);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13.5px}
#toast{position:fixed;left:50%;bottom:calc(var(--navh) + 16px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-size:14px;font-weight:500;z-index:60;max-width:90%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#off{position:fixed;top:0;left:0;right:0;z-index:70;background:var(--warn);color:#000;text-align:center;font-size:12.5px;font-weight:500;padding:calc(6px + env(safe-area-inset-top,0px)) 8px 6px}
#off[hidden],#toast[hidden]{display:none}
.av{width:42px;height:42px;border-radius:50%;background:var(--s3);color:var(--ink);display:grid;place-items:center;font-weight:500;overflow:hidden;flex:none}.av img{width:100%;height:100%;object-fit:cover}.av.lg{width:64px;height:64px;font-size:24px}
.ph{display:flex;gap:8px;overflow-x:auto;margin-top:10px}.ph img{width:96px;height:72px;object-fit:cover;border-radius:12px;flex:none}
.doc{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px dashed var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}.doc.done{border-style:solid;border-color:var(--ok);background:var(--oksoft)}
.unread{box-shadow:inset 3px 0 0 var(--acc)}
.faq{background:var(--s1);border-radius:16px;padding:14px 16px;margin-bottom:10px}.faq summary{font-weight:500;cursor:pointer;font-size:15px}.faq p{margin:10px 0 0;color:var(--mut);font-size:14px}
.rt{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-top:12px}
.ad{position:relative;aspect-ratio:1290/510;border-radius:18px;overflow:hidden;margin-bottom:12px;background:var(--s2)}
.ad img{width:100%;height:100%;object-fit:cover;display:block}
.ad .t{position:absolute;left:0;right:0;bottom:0;padding:22px 14px 10px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff}
.ad.tx .t{position:static;background:none;padding:22px 16px;color:var(--ink)}
.ad small{position:absolute;top:8px;right:10px;background:rgba(0,0,0,.55);color:#fff;padding:2px 8px;border-radius:99px;font-size:11px}

/* Stats, groups, rows */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--s1);border-radius:16px;text-align:center;padding:14px 4px}
.stat b{display:block;font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}.stat span{font-size:11.5px;color:var(--mut)}
.grp{background:var(--s1);border-radius:18px;margin-bottom:14px;overflow:hidden}
.row2{display:flex;align-items:center;gap:14px;width:100%;background:none;border-radius:0;padding:14px 18px;text-align:left;min-height:62px}
.grp .row2+.row2{border-top:1px solid var(--line)}
.row2 .ri{flex:none;display:grid;place-items:center;width:28px;color:var(--mut)}.row2 .rt2{flex:1;min-width:0}
.row2 .rt2 b{display:block;font-weight:500;font-size:15.5px}.row2 .rt2 small{display:block;color:var(--mut);font-weight:400;font-size:13px}.row2 .ch{color:var(--mut);flex:none}
.ring{--p:50;width:48px;height:48px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--s3) 0);display:grid;place-items:center;flex:none;font-weight:500;font-size:12.5px;position:relative}
.ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--s1)}.ring span{position:relative}
.rg{--p:80;width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--s3) 0);position:relative;flex:none}
.rg::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--s1)}
.prog{display:flex;align-items:center;gap:14px;width:100%;background:var(--s1);border-radius:18px;padding:14px 18px;text-align:left;position:relative;margin:0 0 14px;min-height:0}
.prog input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;padding:0}
.prog b{display:block;font-size:15px;font-weight:500}.prog small{color:var(--mut);font-size:13px;font-weight:400}
.phead{display:flex;align-items:center;gap:16px;margin:8px 0 14px}
.pav{position:relative;display:grid;place-items:center;width:76px;height:76px;border-radius:50%;background:var(--s2);overflow:hidden;cursor:pointer;flex:none;color:var(--mut)}
.pav img{width:100%;height:100%;object-fit:cover}.pav input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;padding:0}
.pname{font-size:24px;font-weight:500;letter-spacing:-.02em;line-height:1.15}.pphone{color:var(--mut);font-size:14px}

/* Home: map + sheet */
.home{position:fixed;inset:0;max-width:480px;margin:0 auto;overflow:hidden}
.fullmap{position:absolute;inset:0;background:var(--s1);z-index:0}
.map{background:var(--s1)}
.mapdark .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.65)}
.leaflet-container{font-family:Inter,sans-serif!important;background:var(--s1)!important}
.leaflet-control-attribution{background:var(--sheet)!important;color:var(--mut)!important;font-size:9.5px!important;border-radius:8px;margin:0 8px!important}
.leaflet-control-attribution a{color:var(--mut)!important}
.home .leaflet-top.leaflet-right{margin-top:calc(70px + env(safe-area-inset-top,0px))}
.float{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;justify-content:space-between;z-index:5;pointer-events:none}
.float>*{pointer-events:auto}
.locate{position:absolute;left:16px;top:calc(70px + env(safe-area-inset-top,0px));z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:var(--navh);z-index:6;background:var(--sheet);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:26px 26px 0 0;box-shadow:var(--shadow);padding:0 20px 18px;max-height:calc(100dvh - var(--navh) - 96px);overflow-y:auto;overscroll-behavior:contain}
.home.full .sheet{height:calc(100dvh - var(--navh) - 96px)}
.grab{display:block;width:100%;background:none;min-height:30px;padding:0;border-radius:0;position:sticky;top:0;z-index:2}
.grab i{display:block;width:38px;height:4px;border-radius:9px;background:var(--s3);margin:13px auto}
.where{display:flex;align-items:center;gap:12px;width:100%;background:var(--s2);border-radius:16px;padding:0 18px;min-height:56px;font-size:17px;text-align:left;color:var(--mut);margin-bottom:12px}
.where svg{color:var(--ink)}
.qchips{display:flex;gap:8px;overflow-x:auto;margin-top:12px;scrollbar-width:none}.qchips::-webkit-scrollbar{display:none}
.qchips button{flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;min-height:40px;font-size:13.5px;background:var(--s2)}
.qchips svg{color:var(--mut)}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.shead .x{width:38px;height:38px;min-height:38px;padding:0;display:grid;place-items:center}
.trow{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;width:100%;background:none;border-radius:0;padding:16px 0;text-align:left;border-top:1px solid var(--line);min-height:0}
.trow .tt{font-size:19px;font-weight:500;letter-spacing:-.02em}
.trow .tm b{display:block;font-weight:500;font-size:15.5px;line-height:1.3}
.trow .tm small{display:block;color:var(--mut);font-size:12.5px;font-weight:400;line-height:1.45}
.trow .tp{font-size:17px;font-weight:500;text-align:right;white-space:nowrap}
.mk{background:none!important;border:0!important}
.mk .pp{display:block;transform:translate(-50%,-100%);background:var(--ink);color:var(--bg);font:600 12px/1 Inter,sans-serif;padding:7px 10px;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.4);white-space:nowrap;position:relative}
.mk .me{display:block;width:16px;height:16px;border-radius:50%;background:var(--acc);border:3px solid #fff;transform:translate(-50%,-50%);box-shadow:0 0 0 8px rgba(62,106,225,.25)}
.mk .dot{display:block;width:12px;height:12px;transform:translate(-50%,-50%);background:#fff;border:3px solid #171a20;border-radius:50%}
.mk .dot.b{border-radius:3px;background:#171a20;border-color:#fff}
.mk .car{display:grid;place-items:center;width:34px;height:34px;transform:translate(-50%,-50%);background:var(--acc);border-radius:50%;border:2px solid #fff;box-shadow:0 4px 14px rgba(62,106,225,.55)}

/* Detail with hero map */
.hero{position:relative;height:40vh;min-height:240px;background:var(--s1)}
.hero .map{position:absolute;inset:0;height:100%}
.hero .fb{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;z-index:5}
.dsheet{position:relative;margin-top:-26px;background:var(--bg);border-radius:26px 26px 0 0;padding:26px 20px 0;z-index:3;min-height:60vh}
.rv{display:grid;grid-template-columns:18px 1fr;gap:14px;margin:14px 0}
.rvl{display:flex;flex-direction:column;align-items:center;padding:6px 0}
.rvl i{display:block}
.rvl .d0{width:10px;height:10px;border-radius:50%;border:2.5px solid var(--ink)}
.rvl .d1{width:10px;height:10px;border-radius:2px;background:var(--ink)}
.rvl .ln{width:2px;flex:1;min-height:28px;background:var(--s3);margin:3px 0}
.rvt{display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.rvt small{display:block;color:var(--mut);font-size:12px}.rvt b{font-weight:500;font-size:18px;letter-spacing:-.015em}
.bigprice{font-size:34px;font-weight:500;letter-spacing:-.03em}.bigprice small{font-size:13px;color:var(--mut);letter-spacing:.06em;margin-left:4px;font-weight:400}
.stepper{display:flex;align-items:center;gap:14px}.stepper button{width:44px;height:44px;min-height:44px;padding:0;font-size:20px}.stepper b{min-width:24px;text-align:center;font-size:20px;font-weight:500}
.cta{position:sticky;bottom:calc(var(--navh) + 8px);margin-top:16px;z-index:4}

/* Ride cards + live */
.ride .rtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.rfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.drv{display:flex;align-items:center;gap:12px;min-width:0}.drv b{font-weight:500;display:block}.drv small{color:var(--mut);font-size:12.5px}
.liveon{box-shadow:inset 0 0 0 1px var(--acc)}
.livebox{margin:14px 0 4px}
.livebox .map{height:200px;border-radius:16px;overflow:hidden;position:relative}
.pbar{height:3px;background:var(--s3);border-radius:9px;margin:14px 0 8px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .6s}
.qa{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin:14px 0 4px}
.qa button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px 4px;font-size:12px;min-height:66px;border-radius:16px;background:var(--s2)}

/* Chat */
.msgs{display:flex;flex-direction:column;gap:8px;min-height:42vh;padding-bottom:16px}
.bub{max-width:82%;padding:10px 14px;border-radius:20px;background:var(--s1);align-self:flex-start;word-break:break-word}
.bub.me{align-self:flex-end;background:var(--acc);color:#fff}
.bub small{display:block;font-size:11px;opacity:.65;margin-top:3px}.bub audio{max-width:230px;height:36px}
.cbar{position:sticky;bottom:calc(var(--navh) + 6px);display:flex;gap:8px;align-items:center;background:var(--bg);padding:10px 0}
.cbar input{flex:1}.cbar button{flex:none;padding:0 18px}.rec{flex:1;font-weight:500;color:var(--danger)}

/* Auth */
.auth{padding:calc(48px + env(safe-area-inset-top,0px)) 24px 32px}
.auth .brand{text-align:center;margin-bottom:34px}
.auth .brand p{color:var(--mut);margin:12px 0 0;font-size:14.5px}
.perks{display:grid;gap:14px;margin-top:30px;padding-top:24px;border-top:1px solid var(--line)}
.perks div{display:flex;gap:14px;align-items:center;color:var(--mut);font-size:14px}.perks svg{color:var(--ink);flex:none}

.sheet input,.sheet select,.sheet textarea{background:var(--s2)}
.sf{display:grid;gap:8px;margin:6px 0 4px}
.sf .swap-wrap input{padding-right:56px}
.sf .chips{align-items:center;margin-top:2px}
.sf .chips input{width:150px;flex:none;min-height:38px;padding:0 14px;border-radius:99px;font-size:13.5px}
.sf .seg{margin-top:4px}
.rtop .eyebrow{white-space:nowrap}
.prog,.pav{font-size:16px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:400}
.pav{color:var(--mut)}

.ad.tx{aspect-ratio:auto;min-height:96px}
.ad small{z-index:2}
.card input,.card select,.card textarea,.grp input{background:var(--s2)}

.sw{position:relative;margin-bottom:12px;border-radius:18px;overflow:hidden;background:var(--danger)}
.swa{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding-right:22px;color:#fff;font-weight:500;font-size:14px}
.swc{position:relative;background:var(--s1);touch-action:pan-y;transition:transform .2s ease;will-change:transform}
.swc.drag{transition:none}
.sw .card{margin:0;border-radius:0;background:transparent}
.rate{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.stars{display:flex;gap:2px;margin:4px 0 0}
.stars button{background:none;padding:0 3px;min-height:44px;color:var(--s3);border-radius:10px}
.stars button.on{color:#f5b301}

.live{background:linear-gradient(135deg,#03037a 0%,#0a0a5c 55%,#0a0a40 100%);border-radius:28px;padding:20px;color:#fff;margin:0 0 16px;box-shadow:0 10px 30px rgba(5,5,100,.25)}.live .lh{display:flex;align-items:center;gap:10px;color:#f4b942;font-weight:800;letter-spacing:.6px;font-size:16px;margin-bottom:14px}.live .lh i{width:14px;height:14px;border-radius:50%;background:#5de07f;animation:lpulse 1.8s infinite}.live .lg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.live .lt{background:rgba(255,255,255,.08);border-radius:20px;padding:14px 14px 12px;min-height:112px}.live .lt b{display:block;font-size:34px;font-weight:800;line-height:1;margin-bottom:8px}.live .lt b.g{color:#5de07f}.live .lt span{display:block;font-size:14px;color:rgba(255,255,255,.85);line-height:1.25}.live .lt small{display:block;font-size:12px;color:rgba(255,255,255,.6);margin-top:4px}@keyframes lpulse{0%{box-shadow:0 0 0 0 rgba(93,224,127,.55)}70%{box-shadow:0 0 0 10px rgba(93,224,127,0)}100%{box-shadow:0 0 0 0 rgba(93,224,127,0)}}

function ico(n,s,c){return '<svg viewBox="0 0 24 24" width="'+(s||22)+'" height="'+(s||22)+'" fill="none" stroke="'+(c||"currentColor")+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(IC[n]||"")+'</svg>'}

function today(){return new Date().toISOString().slice(0,10)}
function tomorrow(){var d=new Date();d.setDate(d.getDate()+1);return d.toISOString().slice(0,10)}
function pf(id){return D.profiles.filter(function(p){return p.id==id})[0]}
function rl(id){var r=D.user_roles.filter(function(x){return x.uid==id})[0];return r&&r.role}
function me(){return S.u&&pf(S.u)}
function role(){return rl(S.u)}
function tr(id){return D.trips.filter(function(t){return t.id==id})[0]}
function vh(id){return D.vehicles.filter(function(v){return v.uid==id})[0]}
function bk(id){return D.bookings.filter(function(b){return b.id==id})[0]}
function own(t){return t&&t.driver==S.u&&role()=="conducteur"}
function taken(id){return D.taken[id]||0}
function cl(s){return String(s).replace(/\D/g,"").slice(-10)}
function fmt(t){return esc("+225 "+String(t==null?"":t).replace(/(\d\d)(?=\d)/g,"$1 "))}
function fcfa(n){return Number(n||0).toLocaleString("fr-FR")+" <small>FCFA</small>"}
function fd(d){return d==today()?"Aujourd’hui":d==tomorrow()?"Demain":d.split("-").reverse().slice(0,2).join("/")}
function sc(id){return D.scores[id]!=null?D.scores[id]:70}
function hm(t){return new Date(t).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
function nk(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim()}
function toast(t){var e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true},2800)}
function av(id,l){var p=pf(id);return '<div class="av'+(l?' lg':'')+'">'+(p&&p.photo?'<img src="'+p.photo+'" alt="">':esc(p?p.name.charAt(0):"?"))+'</div>'}
function vph(id){var v=vh(id);return v&&v.photos.length?'<div class="ph">'+v.photos.map(function(u){return '<img src="'+u+'" alt="Photo du véhicule">'}).join("")+'</div>':''}
function wkb(id){var p=pf(id),w=p&&p.work;if(!w||rl(id)!="conducteur")return"";return '<span class="badge">'+ico("clock",14)+ (w.t=="quotidien"?"Quotidien"+(w.days&&w.days.length?" · "+w.days.map(function(i){return LJ[i]}).join(" "):""):"Occasionnel")+'</span>'}
function fb(id){var p=pf(id),k=rl(id)=="conducteur"?p.dv=="verified":p.idv=="ok";return '<span class="badge '+(k?'b-ok':'b-wait')+'">'+(k?ico("check",14):ico("alert",14))+(rl(id)=="conducteur"?(k?"Vérifié":"En vérification"):(k?"Identité vérifiée":"Identité non vérifiée"))+'</span><span class="badge num">'+ico("star",14)+'Fiabilité '+sc(id)+'/100</span>'+rbadge(id)+wkb(id)}
function sb(st){var m={attente:["En attente","b-wait","clock"],"acceptée":["Acceptée","b-ok","check"],"refusée":["Refusée","b-red","alert"],"annulée":["Annulée","","alert"],"publié":["Publié","","car"],"en cours":["En cours","b-wait","car"],"terminé":["Terminé","b-ok","check"]}[st]||[st,"","info"];return '<span class="badge '+m[1]+'">'+ico(m[2],14)+m[0]+'</span>'}
function badge2(s){return '<span class="badge '+({g:"b-ok",a:"b-wait",n:""}[s[1]])+'">'+ico(s[1]=="g"?"check":s[1]=="a"?"clock":"alert",14)+s[0]+'</span>'}
function up(l,f,k,m,a){return '<div class="up"><span>'+l+'</span><input type="file" data-f="'+f+'"'+(k?' data-k="'+k+'"':'')+(m?' multiple':'')+' accept="'+a+'"></div>'}
function inp(id,label,val,type,ph,ex){return '<label>'+label+'</label><input id="'+id+'" '+(type?'type="'+type+'" ':'')+'value="'+esc(val==null?"":val)+'" '+(ph?'placeholder="'+ph+'" ':'')+(ex||"")+'>'}

  var a1=li?'data-a="tab" data-t="cgu"':'data-a="pol2"',a2=li?'data-a="tab" data-t="priv"':'data-a="pol1"';
  return '<p style="text-align:center;font-size:12px;color:var(--mut);margin:32px 0 0">© 2026 Digitalk Afrique. Tous droits réservés.<br><a href="#" '+a1+' style="color:var(--mut)">Conditions d’utilisation</a> · <a href="#" '+a2+' style="color:var(--mut)">Confidentialité</a></p>'
}

function cgu(){return '<h1>Conditions d’utilisation</h1><p class="sub">Dernière mise à jour : novembre 2026</p><div class="card"><p><b>1. Objet.</b> Trajet, éditée par Digitalk Afrique, met en relation des conducteurs et des passagers en Côte d’Ivoire. Trajet est un service d’intermédiation : il n’est pas transporteur.</p><p><b>2. Gratuité.</b> Le service est gratuit et sans commission. Le prix est fixé par le conducteur et réglé directement entre le conducteur et le passager.</p><p><b>3. Sécurité.</b> Le bouton SOS prévient l’équipe Trajet et facilite l’appel de votre contact d’urgence.</p><p><b>4. Droit applicable.</b> Ces conditions sont soumises au droit ivoirien.</p></div>'}
function pol(){return '<h1>Confidentialité</h1><div class="card"><p>Trajet est gratuit et sans commission. Le paiement se fait directement entre conducteur et passager, jamais dans l’application.</p><p><b>Données collectées :</b> nom, numéro +225, photo, trajets et réservations. Elles servent uniquement au fonctionnement du service.</p></div>'}

function rpForm(){var w=pf(S.rp.who);return '<button class="link" data-a="rpx">'+ico("chev",16)+' Annuler</button><h1>Signaler</h1><p class="sub">Signalement concernant <b>'+esc(w?w.name:"?")+'</b>. L’équipe Trajet lira votre message et décidera des suites.</p><label>Motif</label><select id="rpm">'+MOT.map(function(x){return '<option>'+x+'</option>'}).join("")+'</select><label>Détails</label><textarea id="rpt" rows="4" maxlength="400" placeholder="Expliquez ce qui s’est passé…"></textarea><button class="pri full" style="margin-top:16px" data-a="rps">Envoyer le signalement</button>'}

function workCard(m){var w=m.work||{t:"occasionnel",days:[]};return '<div class="card"><b>Mon activité</b><p class="sub" style="font-size:13px;margin:4px 0 10px">Les passagers voient si vous roulez au quotidien ou de façon occasionnelle.</p><div class="seg">'+[["occasionnel","Occasionnel"],["quotidien","Quotidien"]].map(function(x){return '<button data-a="wk" data-v="'+x[0]+'" class="'+(w.t==x[0]?"on":"")+'">'+x[1]+'</button>'}).join("")+'</div>'+(w.t=="quotidien"?'<label>Jours de travail</label><div class="seg">'+LJ.map(function(d,i){return '<button style="padding:10px 2px" data-a="wd" data-id="'+i+'" class="'+((w.days||[]).indexOf(i)>-1?"on":"")+'">'+d+'</button>'}).join("")+'</div>':'')+'</div>'}
function sosCard(m){var s=m.sos;return '<div class="card"><b>Numéro d’urgence (SOS)</b><p class="sub" style="font-size:13px;margin:4px 0 0">Le proche à prévenir en cas d’alerte. Visible uniquement par vous et l’équipe Trajet.</p><label>Nom du contact</label><input id="sosn" placeholder="Maman, frère…" value="'+esc(s?s.name:"")+'"><label>Numéro</label><div class="tel"><b>+225</b><input id="sost" type="tel" inputmode="numeric" placeholder="07 00 00 00 00" value="'+esc(s?s.tel:"")+'"></div><div class="btns"><button class="pri" data-a="sossave">Enregistrer</button>'+(s?'<button class="out" data-a="sosdel">Retirer</button>':'')+'</div></div>'}
function secretCard(m){return '<div class="card"><b>Mot secret</b><p class="sub" style="font-size:13px;margin:4px 0 0">'+(m.hs?'<span class="badge b-ok">'+ico("check",14)+'Défini</span> Il prouve que c’est bien toi si tu oublies ton mot de passe.':'<span class="badge b-wait">'+ico("clock",14)+'À définir</span> Choisis un mot de 5 ou 6 lettres pour récupérer ton compte.')+'</p>'+(m.hs?'<label>Ancien mot secret</label><input id="so" maxlength="6" autocomplete="off" autocapitalize="none">':'')+'<label>'+(m.hs?'Nouveau mot secret':'Mot secret')+' (5 ou 6 lettres)</label><input id="sn2" maxlength="6" autocomplete="off" autocapitalize="none" placeholder="ex. soleil"><button class="pri full" style="margin-top:12px" data-a="secset">Enregistrer</button></div>'}

function notifCount(){var m=me();return m?D.notifs.filter(function(x){return x.to==m.id&&!x.r&&!hid("n",x.id)}).length:0}
function routeV(t){return '<div class="rv"><div class="rvl"><i class="d0"></i><i class="ln"></i><i class="d1"></i></div><div class="rvt"><div><small class="num">Départ · '+t.time+'</small><b>'+esc(t.from)+'</b></div><div><small>Arrivée</small><b>'+esc(t.to)+'</b></div></div></div>'}
function adHtml(){
  var l=D.ads.filter(function(x){return x.on});
  if(!l.length)return'';
  var x=l[(S.ai||0)%l.length];
  return '<div class="ad'+(x.i?'':' tx')+'">'+(x.i?'<img src="'+x.i+'" alt="">':'')+'<small>Annonce</small>'+(x.t||x.x?'<div class="t"><b style="font-size:17px;font-weight:500">'+esc(x.t)+'</b><div style="font-size:14px">'+esc(x.x)+'</div></div>':'')+'</div>'

  var n=notifCount(),back=ALL.indexOf(S.tab)>-1;
  return '<header>'+(back?'<button class="backb" data-a="tab" data-t="'+TABS[role()][0]+'">'+ico("back",20)+'Retour</button>':'<div class="wm">Trajet</div>')+
    '<div class="hr"><span class="role">'+{passager:"Passager",conducteur:"Conducteur",admin:"Admin"}[role()]+'</span><button class="fb" data-a="tab" data-t="notif" aria-label="Notifications">'+ico("bell",20)+(n?'<i>'+n+'</i>':'')+'</button></div></header>'
}
function nav(){
  return '<nav><div>'+TABS[role()].map(function(t){
    return '<button data-a="tab" data-t="'+t+'" class="'+(S.tab==t?"on":"")+'">'+ico(TAB_IC[t]||"car",22)+'<span>'+LBL[t]+'</span></button>'
  }).join("")+'</div></nav>'
}

function brandBlock(tag){return '<div class="brand"><div class="wm lg" data-a="tap">Trajet</div>'+(tag?'<p>'+tag+'</p>':'')+'</div>'}

function hav(a,b,c,d){var R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,z=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(z))}
function gps(hi){return new Promise(function(res){if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,speed:p.coords.speed})},function(){res(null)},{enableHighAccuracy:!!hi,timeout:12000,maximumAge:5000})})}
function cityOf(a){return a.city||a.town||a.village||a.municipality||a.county||a.state_district||""}
async function geo2(q){try{var r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&addressdetails=1&countrycodes=ci&q="+encodeURIComponent(q));var j=await r.json();if(!j[0])return null;return{lat:+j[0].lat,lng:+j[0].lon,city:cityOf(j[0].address||{})}}catch(e){return null}}
async function rev(lat,lng){try{var r=await fetch("https://nominatim.openstreetmap.org/reverse?format=json&zoom=10&addressdetails=1&lat="+lat+"&lon="+lng);var j=await r.json();return cityOf(j.address||{})}catch(e){return ""}}
function geoQ(txt,ms2){var p=geo2(txt);return Promise.race([p,new Promise(function(r){setTimeout(function(){r(null)},ms2||2000)})]).then(function(r){return{r:r,p:p}})}

var TRK={id:null,w:null,last:0};
function startTrack(tid){if(TRK.id==tid||!navigator.geolocation)return;stopTrack();TRK.id=tid;TRK.w=navigator.geolocation.watchPosition(function(p){var n=Date.now();if(n-TRK.last<5000)return;TRK.last=n;SB.from("trip_positions").upsert({trip_id:tid,lat:p.coords.latitude,lng:p.coords.longitude,speed:p.coords.speed,updated_at:new Date().toISOString()}).then(function(){})},function(){toast("Active la localisation")},{enableHighAccuracy:true,maximumAge:3000,timeout:20000})}
function stopTrack(){if(TRK.w!=null&&navigator.geolocation)navigator.geolocation.clearWatch(TRK.w);TRK.w=null;TRK.id=null}
function resumeTrack(){var t=D.trips.filter(function(x){return x.driver==S.u&&x.st=="en cours"})[0];if(t&&role()=="conducteur")startTrack(t.id);else stopTrack()}
function ago(a){var s=Math.max(0,Math.round((Date.now()-a)/1000));return s<60?"il y a "+s+" s":"il y a "+Math.round(s/60)+" min"}
function prog(t){var p=D.pos[t.id];if(!p||t.tlat==null||t.flat==null)return null;var tot=hav(t.flat,t.flng,t.tlat,t.tlng);if(tot<0.05)return null;var rem=hav(p.lat,p.lng,t.tlat,t.tlng);return{p:Math.max(0,Math.min(1,1-rem/tot)),rem:rem,at:p.at,lat:p.lat,lng:p.lng}}
function dist(r){return r<1?Math.round(r*1000)+" m":r.toFixed(1)+" km"}

/* ===== NEW: maps (Leaflet, fond sombre/clair) ===== */
/* Fond de carte OpenStreetMap : gratuit, sans clé. Pour changer de fournisseur, il suffit de modifier cette adresse. */
var TILE_URL="https://tile.openstreetmap.org/{z}/{x}/{y}.png";
var MAPS=[];
function killMaps(){MAPS.forEach(function(x){try{x.map.remove()}catch(e){}});MAPS=[]}
function isDark(){var th=document.documentElement.getAttribute("data-theme");return th=="light"?false:th=="auto"?!!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches):true}
function baseMap(el,c,z){
  var m=L.map(el,{zoomControl:false,attributionControl:false,zoomSnap:.5,tap:false}).setView(c,z);
  L.control.attribution({position:"topright",prefix:false}).addTo(m);
  el.classList.toggle("mapdark",isDark());
  L.tileLayer(TILE_URL,{maxZoom:19,referrerPolicy:"strict-origin-when-cross-origin",attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(m);
  setTimeout(function(){try{m.invalidateSize()}catch(e){}},80);
  return m
}
function pin(html){return L.divIcon({className:"mk",html:html,iconSize:null})}
function mountHome(el){
  var m=me(),has=m&&m.lat!=null,map=baseMap(el,has?[m.lat,m.lng]:[5.36,-4.0083],has?13:11),o={type:"home",map:map,layer:L.layerGroup().addTo(map)};
  MAPS.push(o);homeMarkers(o,true)
}
function homeMarkers(o,fit){
  var m=me(),pts=[];o.layer.clearLayers();
  if(m&&m.lat!=null){L.marker([m.lat,m.lng],{icon:pin('<span class="me"></span>'),interactive:false}).addTo(o.layer);pts.push([m.lat,m.lng])}
  filtered().forEach(function(t){if(t.flat==null)return;
    L.marker([t.flat,t.flng],{icon:pin('<span class="pp num">'+Number(t.price).toLocaleString("fr-FR")+'</span>')}).addTo(o.layer).on("click",function(){A.open({},t.id);render()});
    pts.push([t.flat,t.flng])});
  if(fit&&pts.length>1){try{o.map.fitBounds(L.latLngBounds(pts),{paddingTopLeft:[40,110],paddingBottomRight:[40,340],maxZoom:14})}catch(e){}}
}
function refreshHome(){MAPS.forEach(function(o){if(o.type=="home")homeMarkers(o,false)})}
function mountTrip(el){
  var t=tr(+el.dataset.id);if(!t)return;
  var g=prog(t),pts=[],map=baseMap(el,[5.36,-4.0083],11),o={type:"trip",id:t.id,map:map};
  if(t.flat!=null){L.marker([t.flat,t.flng],{icon:pin('<span class="dot"></span>'),interactive:false}).addTo(map);pts.push([t.flat,t.flng])}
  if(t.tlat!=null){L.marker([t.tlat,t.tlng],{icon:pin('<span class="dot b"></span>'),interactive:false}).addTo(map);pts.push([t.tlat,t.tlng])}
  if(pts.length==2)L.polyline(pts,{color:isDark()?"#f4f4f4":"#171a20",weight:2,opacity:.7,dashArray:"2 8",lineCap:"round"}).addTo(map);
  if(t.st=="en cours"&&g){o.car=L.marker([g.lat,g.lng],{icon:pin('<span class="car">'+ico("car",16,"#fff")+'</span>'),interactive:false}).addTo(map);pts.push([g.lat,g.lng])}
  MAPS.push(o);
  if(pts.length>1){try{map.fitBounds(L.latLngBounds(pts),{padding:[50,50],maxZoom:15})}catch(e){}}
  else if(pts.length==1)map.setView(pts[0],14)
}
function liveTick(){
  MAPS.forEach(function(o){
    if(o.type!="trip")return;var t=tr(o.id);if(!t||t.st!="en cours")return;var g=prog(t);if(!g)return;
    if(o.car)o.car.setLatLng([g.lat,g.lng]);else{o.car=L.marker([g.lat,g.lng],{icon:pin('<span class="car">'+ico("car",16,"#fff")+'</span>'),interactive:false}).addTo(o.map)}
    var x=$("lvt"+t.id);if(x)x.textContent="À "+dist(g.rem)+" de l’arrivée · "+ago(g.at);
    var b=$("lvp"+t.id);if(b)b.style.width=Math.round(g.p*100)+"%"
  })
}
function afterRender(){
  if(typeof L==="undefined")return;
  Array.prototype.forEach.call(document.querySelectorAll("[data-map]"),function(el){try{el.dataset.map=="home"?mountHome(el):mountTrip(el)}catch(e){}})
}
function live(t){
  if(t.st!=="en cours")return'';
  var g=prog(t),info=g?"À "+dist(g.rem)+" de l’arrivée · "+ago(g.at):"En attente de la position du conducteur…";
  return '<div class="livebox"><div class="map" data-map="trip" data-id="'+t.id+'"></div><div class="pbar"><i id="lvp'+t.id+'" style="width:'+(g?Math.round(g.p*100):0)+'%"></i></div><div class="meta num" id="lvt'+t.id+'" style="margin:0">'+info+'</div></div>'
}


function cmpT(a,b){return (a.date+a.time).localeCompare(b.date+b.time)}

return '<div class="chips"><button data-a="'+act+'" data-v="" class="'+(!cur?"on":"")+'">Toutes</button>'+a.map(function(c){return '<button data-a="'+act+'" data-v="'+esc(c.k)+'" class="'+(cur==c.k?"on":"")+'">'+esc(c.n)+' ('+c.c+')</button>'}).join("")+'</div>'}

function recents(m){var seen={},out=[],push=function(p,l){var k=nk(p);if(!p||seen[k]||out.length>=3)return;seen[k]=1;out.push({p:p,l:l})};(m.places||[]).forEach(function(x){seen[nk(x.p)]=1});D.bookings.filter(function(b){return b.uid==m.id}).slice().reverse().forEach(function(b){var t=tr(b.trip);if(t)push(t.to,t.to)});D.rr.filter(function(r){return r.uid==m.id}).slice().reverse().forEach(function(r){push(r.to,r.to)});return out}

function filtered(){
  var q=S.q,m=me(),ck=S.city||"",so=S.sort||(m&&m.lat!=null?"prox":"heure");
  var l=D.trips.filter(function(t){
    return t.st=="publié"&&t.seats-taken(t.id)>0&&
      (!q.f||nk(t.from).indexOf(nk(q.f))>-1)&&
      (!q.t||nk(t.to).indexOf(nk(q.t))>-1)&&
      (!q.d||t.date==q.d)&&
      (q.v=="all"||t.veh==q.v)&&
      (!ck||nk(t.fcity)==ck||nk(t.from)==ck)
  }).map(function(t){var o=Object.assign({},t);o.dk=(m&&m.lat!=null&&t.flat!=null)?hav(m.lat,m.lng,t.flat,t.flng):null;return o});
  l.sort(so=="prix"?function(a,b){return a.price-b.price||cmpT(a,b)}:so=="prox"?function(a,b){return(a.dk==null?1e9:a.dk)-(b.dk==null?1e9:b.dk)||cmpT(a,b)}:cmpT);
  return l
}

  var d=pf(t.driver),free=t.seats-taken(t.id),k=d&&d.dv=="verified";
  return '<button class="trow" data-a="open" data-id="'+t.id+'"><span class="tt num">'+t.time+'</span><span class="tm"><b>'+esc(t.from)+' → '+esc(t.to)+'</b><small>'+fd(t.date)+' · '+t.veh+' · '+free+' place'+(free>1?'s':'')+(t.dk!=null?' · '+dist(t.dk):'')+'</small><small>'+esc(d?d.name:"Conducteur")+(k?' · Vérifié':'')+' · '+sc(t.driver)+'/100'+(D.rs[t.driver]&&D.rs[t.driver].n?' · ★ '+D.rs[t.driver].avg.toFixed(1):'')+'</small></span><span class="tp num">'+Number(t.price).toLocaleString("fr-FR")+'<small>F</small></span></button>'
}

var busy=0;
/* Balayage vers la gauche : supprimer */
(function(){
  var c=null,x0=0,y0=0,dx=0,lock=0,moved=0;
  document.addEventListener("pointerdown",function(e){var t=e.target.closest(".swc");if(!t)return;c=t;x0=e.clientX;y0=e.clientY;dx=0;lock=0;moved=0});
  document.addEventListener("pointermove",function(e){
    if(!c)return;var mx=e.clientX-x0,my=e.clientY-y0;
    if(!lock){if(Math.abs(mx)>10&&Math.abs(mx)>Math.abs(my)*1.4)lock=1;else if(Math.abs(my)>10)lock=-1;if(lock==1){c.classList.add("drag");try{c.setPointerCapture(e.pointerId)}catch(x){}}}
    if(lock==1){dx=Math.min(0,mx);moved=1;c.style.transform="translateX("+dx+"px)"}
  });
  function end(){
    if(!c)return;var t=c;c=null;t.classList.remove("drag");
    if(lock!=1)return;
    if(dx<-Math.min(120,t.offsetWidth*.35)){t.style.transform="translateX(-110%)";setTimeout(function(){var id=t.dataset.id;exec(A.hide,{k:t.dataset.sw},/^\d+$/.test(id)?+id:id,null)},180)}
    else t.style.transform="";
    setTimeout(function(){moved=0},60)
  }
  document.addEventListener("pointerup",end);document.addEventListener("pointercancel",end);
  document.addEventListener("click",function(e){if(moved){e.stopPropagation();e.preventDefault()}},true);
})();
function exec(f,ds,id,b){

  if(rr&&rr.then){
    busy=1;if(b&&b.tagName=="BUTTON"&&!b.classList.contains("fb"))b.style.opacity="0.65";
    rr.then(function(){return S.u&&!f.nl?load(f.r):0}).then(guardBan).catch(function(x){toast(x&&x.message?x.message:"Erreur")}).then(function(){busy=0;render();if(f.after&&S.u)bg(ALLP.filter(function(p){return p!="people"}))})
  }else render()
}

/* SOS : appui long (1,2 s) pour éviter les alertes accidentelles */
(function(){
  var T=null,B=null;
  function end(){clearTimeout(T);if(B){B.classList.remove("go");B=null}}
  document.addEventListener("pointerdown",function(e){
    var b=e.target.closest("[data-hold]");if(!b||busy)return;
    B=b;b.classList.add("go");
    T=setTimeout(function(){var id=+b.dataset.id;end();try{navigator.vibrate&&navigator.vibrate(80)}catch(x){}exec(A[b.dataset.hold],{},id,b)},1200)
  });
  ["pointerup","pointercancel"].forEach(function(n){document.addEventListener(n,end,true)});
  document.addEventListener("contextmenu",function(e){if(e.target.closest("[data-hold]"))e.preventDefault()});
})();
