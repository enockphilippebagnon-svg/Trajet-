<style>
:root{
  --bg:#f4f6f9;--card:#ffffff;--soft:#edf0f5;--ink:#12141c;--mut:#646a7c;--line:#e2e6ef;
  --red:#e8383b;--red-h:#d1292c;--redsoft:#fdeeee;
  --green:#16804d;--greensoft:#e3f5ec;
  --amber:#946500;--ambersoft:#fcf0d4;
  --shadow:0 8px 30px rgba(18,20,28,.06);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b0d12;--card:#141720;--soft:#1d212c;--ink:#f3f4f8;--mut:#949ba8;--line:#282d3c;
    --redsoft:#381c20;--greensoft:#153024;--green:#5ce09e;--amber:#f5c558;--ambersoft:#382e18;
    --shadow:0 8px 30px rgba(0,0,0,.4);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0d12;--card:#141720;--soft:#1d212c;--ink:#f3f4f8;--mut:#949ba8;--line:#282d3c;
  --redsoft:#381c20;--greensoft:#153024;--green:#5ce09e;--amber:#f5c558;--ambersoft:#382e18;
  --shadow:0 8px 30px rgba(0,0,0,.4);color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
.num{font-variant-numeric:tabular-nums}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:104px}

/* Map container styling */
.map-box{width:100%;height:240px;border-radius:16px;overflow:hidden;margin:12px 0;border:1.5px solid var(--line);z-index:1}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card)!important;color:var(--ink)!important;border-radius:12px!important;box-shadow:var(--shadow)!important}
.leaflet-container{font-family:"Plus Jakarta Sans",sans-serif!important}

/* Header & Bottom Navigation */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--card);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 18px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 4px 12px rgba(232,56,59,.35)}
.brand{font-size:22px;font-weight:800;letter-spacing:-.5px}.brand b{color:var(--red)}
.role{margin-left:auto;font-size:12px;font-weight:700;background:var(--redsoft);color:var(--red);padding:5px 11px;border-radius:99px}
.bell{position:relative;background:var(--soft);padding:0;width:40px;height:40px;min-height:40px;border-radius:50%;display:grid;place-items:center}
.bell i{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font:700 11px/18px sans-serif;min-width:18px;border-radius:99px;font-style:normal;padding:0 4px}

nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:15}
nav div{max-width:480px;margin:0 auto;display:flex;gap:4px}
nav button{flex:1;background:transparent;font-size:11px;font-weight:700;padding:6px 4px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:52px;border-radius:12px;transition:all .15s}
nav button.on{background:var(--redsoft);color:var(--red)}

/* Layout & Cards */
main{padding:18px}
h1{font-size:26px;margin:4px 0 4px;letter-spacing:-.6px;line-height:1.15}
h2{font-size:18px;margin:22px 0 10px;letter-spacing:-.3px}
p.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.route{font-size:18px;font-weight:800;letter-spacing:-.3px}
.meta{color:var(--mut);font-size:13.5px;margin:4px 0 10px}
.price{color:var(--red);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.rl{justify-content:flex-start}

/* Badges & Buttons */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--mut);margin:0 4px 4px 0}
.b-ok{background:var(--greensoft);color:var(--green)}.b-wait{background:var(--ambersoft);color:var(--amber)}.b-red{background:var(--redsoft);color:var(--red)}

button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 16px;cursor:pointer;background:var(--soft);color:var(--ink);min-height:46px;transition:transform .1s,opacity .15s}
button:active:not(:disabled){transform:scale(.98)}
button:disabled{opacity:.5;cursor:not-allowed}
button.pri{background:var(--red);color:#fff;box-shadow:0 4px 14px rgba(232,56,59,.3)}
button.ok{background:var(--green);color:#fff}
button.out{background:transparent;border:1.5px solid var(--line)}
button.sos{background:#b3212a;color:#fff;width:100%;box-shadow:0 4px 14px rgba(179,33,42,.35)}
button.full{width:100%}
.btns{display:flex;gap:10px;margin-top:12px}.btns>button{flex:1}
.link{background:none;color:var(--red);padding:6px 0;min-height:0;font-size:14px}

/* Form inputs & controls */
label{display:block;font-weight:700;font-size:13.5px;margin:12px 0 6px}
input,select,textarea{width:100%;min-width:0;font:inherit;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red)}
input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--red)}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;max-width:100%;min-height:48px;display:block}
.swap-wrap{position:relative}
.swap-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:36px;height:36px;min-height:36px;padding:0;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:16px}

/* Segments, Chips & Grids */
.seg{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:16px;overflow-x:auto}
.seg button{flex:1;background:transparent;padding:9px 10px;min-height:40px;white-space:nowrap;font-size:14px}
.seg button.on{background:var(--red);color:#fff;box-shadow:0 2px 8px rgba(232,56,59,.25)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:7px 14px;min-height:36px;border-radius:99px;font-size:13.5px}
.chips button.on{background:var(--red);color:#fff}

/* Banner / Ads */
.ad{position:relative;height:130px;border-radius:20px;overflow:hidden;margin-bottom:14px;background:linear-gradient(135deg,#e8383b,#ff9f5a);color:#fff}
.ad img{width:100%;height:100%;object-fit:cover;display:block}
.ad .t{position:absolute;left:0;right:0;bottom:0;padding:24px 14px 10px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.ad.tx .t{position:static;background:none;padding:22px 16px}
.ad.bn{height:auto;background:none;border-radius:16px}.ad.bn img{width:100%;height:auto;object-fit:contain;display:block}
.ad small{position:absolute;top:8px;right:10px;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:99px;font-size:11px}

/* Tiles & Quick elements */
.lbar{margin-bottom:12px}.lt1{font-size:12.5px;color:var(--mut);font-weight:600}.lt2{font-size:20px;font-weight:800;letter-spacing:-.3px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px 14px 14px;text-align:left;min-height:144px;overflow:hidden;box-shadow:var(--shadow)}
.tile svg{width:100%;height:70px;margin-bottom:4px}.tile b{font-size:16.5px}.tile small{color:var(--mut);font-weight:600;font-size:12.5px}
.tile.on{border-color:var(--red);background:var(--redsoft)}

.where{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px 16px;font-size:17px;margin-bottom:6px;box-shadow:var(--shadow)}
.where b{flex:1;text-align:left}.where span.ico-wrap{background:var(--red);color:#fff;width:30px;height:30px;border-radius:50%;display:grid;place-items:center}

.prow{display:flex;align-items:center;gap:14px;width:100%;background:none;border-radius:0;padding:12px 4px;text-align:left;border-bottom:1px solid var(--line)}
.prow .pi{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;flex:none}
.prow b{display:block;font-size:15px}.prow small{color:var(--mut);font-weight:500;font-size:13px}

.safe{background:linear-gradient(135deg,#0f264d,#1d4c9c);color:#fff;border-radius:24px;padding:22px;margin:22px 0 8px;position:relative;overflow:hidden}
.safe .st{font-size:24px;font-weight:800;line-height:1.1;letter-spacing:-.5px}
.safe p{margin:8px 0 14px;opacity:.9;max-width:65%;font-size:14px}
.safe .chips2{display:flex;flex-wrap:wrap;gap:8px;max-width:80%}
.safe .chips2 button{background:rgba(255,255,255,.16);color:#fff;border-radius:99px;padding:7px 13px;min-height:34px;font-size:12.5px}
.safe svg.bg{position:absolute;right:-6px;top:10px;width:115px}

/* Profile avatars & stats */
.pavw{position:relative;width:110px;margin:6px auto 12px}
.pav{position:relative;display:grid;place-items:center;width:110px;height:110px;border-radius:50%;background:var(--soft);overflow:hidden;cursor:pointer;border:3px solid var(--card);box-shadow:var(--shadow)}
.pav img{width:100%;height:100%;object-fit:cover}.pav input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;padding:0}
.pavb{position:absolute;right:0;bottom:2px;width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700;border:3px solid var(--bg)}
.pname{font-size:24px;font-weight:800;text-align:center;letter-spacing:-.4px}.pphone{text-align:center;color:var(--mut);margin-bottom:8px;font-size:14px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:16px 0}
.qa button{background:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;font-size:12.5px;min-height:0}
.qa .c{width:56px;height:56px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow)}

.prog{display:flex;align-items:center;gap:14px;width:100%;background:var(--redsoft);border-radius:20px;padding:14px 16px;text-align:left;position:relative;margin:6px 0 16px}
.prog input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;padding:0}
.prog b{color:var(--red);display:block;font-size:15px}.prog small{color:var(--red);opacity:.85;font-weight:600;font-size:13px}
.ring{--p:50;width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--red) calc(var(--p)*1%),rgba(232,56,59,.2) 0);display:grid;place-items:center;flex:none;font-weight:800;font-size:13.5px;color:var(--red);position:relative}
.ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--redsoft)}.ring span{position:relative}
.rg{--p:80;width:28px;height:28px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p)*1%),var(--line) 0);position:relative;flex:none}
.rg::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--card)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:center;padding:12px 4px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--mut)}

.grp{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:2px 0;margin-bottom:14px;box-shadow:var(--shadow)}
.row2{display:flex;align-items:center;gap:14px;width:100%;background:none;border-radius:0;padding:14px 16px;text-align:left;min-height:60px}
.grp .row2+.row2{border-top:1px solid var(--line)}
.row2 .ri{flex:none;display:grid;place-items:center;width:30px}.row2 .rt2{flex:1;min-width:0}
.row2 .rt2 b{display:block;font-weight:700;font-size:15.5px}.row2 .rt2 small{display:block;color:var(--mut);font-weight:500;font-size:13px}.row2 .ch{color:var(--mut);flex:none}

/* Messages, Chat & Tracking */
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:24px 18px;text-align:center;color:var(--mut);font-size:14.5px}
.note{background:var(--ambersoft);color:var(--amber);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13.5px;font-weight:600}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:30;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.av{width:42px;height:42px;border-radius:50%;background:var(--redsoft);color:var(--red);display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none}.av img{width:100%;height:100%;object-fit:cover}.av.lg{width:64px;height:64px;font-size:24px}
.ph{display:flex;gap:8px;overflow-x:auto;margin-top:10px}.ph img{width:96px;height:72px;object-fit:cover;border-radius:12px;flex:none}
.doc{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}.doc.done{border-style:solid;border-color:var(--green);background:var(--greensoft)}
.up{position:relative;overflow:hidden;display:inline-block;flex:none}.up input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;padding:0}.up span{display:inline-block;background:var(--soft);padding:10px 14px;border-radius:12px;font-weight:700;font-size:13.5px;color:var(--ink)}
.tel{display:flex;gap:8px}.tel b{background:var(--soft);border-radius:14px;padding:13px 12px;display:grid;place-items:center}.unread{border-color:var(--red)}
.chk{display:flex;gap:10px;align-items:center;margin:14px 0}.chk label{margin:0;font-weight:400;font-size:13.5px}
.faq{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}.faq summary{font-weight:700;cursor:pointer;font-size:15px}.faq p{margin:10px 0 0;color:var(--mut);font-size:14px}

.msgs{display:flex;flex-direction:column;gap:8px;min-height:42vh;padding-bottom:16px}
.bub{max-width:82%;padding:10px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);align-self:flex-start;word-break:break-word}
.bub.me{align-self:flex-end;background:var(--red);color:#fff;border-color:var(--red)}
.bub small{display:block;font-size:11px;opacity:.7;margin-top:3px}.bub audio{max-width:230px;height:36px}
.cbar{position:sticky;bottom:76px;display:flex;gap:8px;align-items:center;background:var(--bg);padding:10px 0;border-top:1px solid var(--line)}
.cbar input{flex:1}.cbar button{flex:none}.rec{flex:1;font-weight:700;color:var(--red)}

.rt{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;margin-top:12px}

/* Onboarding Modal */
.ob{position:fixed;inset:0;z-index:45;background:#111;color:#fff;display:flex;flex-direction:column}.ob[hidden]{display:none}
.track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.track::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:start;position:relative;overflow:hidden}.sl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sl::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,16,.92) 0,rgba(10,10,16,.4) 45%,transparent 72%)}
.otx{position:absolute;left:24px;right:24px;bottom:150px;z-index:2}.otx h2{font-size:30px;line-height:1.1;margin:0 0 10px;letter-spacing:-.8px}.otx p{margin:0;font-size:16px;opacity:.92}
.obar{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:20px 24px calc(24px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:16px}.dots i{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.4)}.dots i.on{width:26px;background:#fff}
.skip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:18px;z-index:3;background:rgba(0,0,0,.45);color:#fff;min-height:40px;padding:8px 16px;border-radius:99px}
</style>

(function(){
  try{
    var th=localStorage.getItem("trajet_theme");
    if(th==="dark"||th==="light")document.documentElement.setAttribute("data-theme",th);
  }catch(e){}
  if('serviceWorker' in navigator){
    var swCode = "const CACHE_NAME = 'trajet-cache-v4';\n" +
      "const ASSETS = ['/', '/index.html', 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js', 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css', 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js', 'https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap'];\n" +
      "self.addEventListener('install', e => { e.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(ASSETS)).then(() => self.skipWaiting())); });\n" +
      "self.addEventListener('activate', e => { e.waitUntil(caches.keys().then(keys => Promise.all(keys.map(k => { if(k !== CACHE_NAME) return caches.delete(k); }))).then(() => self.clients.claim())); });\n" +
      "self.addEventListener('fetch', e => { if (e.request.method !== 'GET') return; e.respondWith(caches.match(e.request).then(cached => cached || fetch(e.request).then(res => { if(res.status === 200 && res.type === 'basic') { var rClone = res.clone(); caches.open(CACHE_NAME).then(cache => cache.put(e.request, rClone)); } return res; }).catch(() => caches.match('/index.html')))); });\n";
    var blob = new Blob([swCode], {type: 'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(function(){});
  }
})();

  cam:'<path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',

  price:'<svg viewBox="0 0 120 80"><rect x="10" y="12" width="100" height="52" rx="14" fill="#e8383b"/><path d="M92 64l10 12-18-8z" fill="#e8383b"/><text x="60" y="46" text-anchor="middle" font-family="Plus Jakarta Sans,sans-serif" font-weight="800" font-size="20" fill="#fff">1 500 F</text></svg>',

function today(){return new Date().toISOString().slice(0,10)}
function tomorrow(){var d=new Date();d.setDate(d.getDate()+1);return d.toISOString().slice(0,10)}
function pf(id){return D.profiles.filter(function(p){return p.id==id})[0]}
function rl(id){var r=D.user_roles.filter(function(x){return x.uid==id})[0];return r&&r.role}
function me(){return S.u&&pf(S.u)}
function role(){return rl(S.u)}
function tr(id){return D.trips.filter(function(t){return t.id==id})[0]}
function vh(id){return D.vehicles.filter(function(v){return v.uid==id})[0]}
function bk(id){return D.bookings.filter(function(b){return b.id==id})[0]}
function own(t){return t&&t.driver==S.u&&role()=="conducteur"}
function taken(id){return D.taken[id]||0}
function cl(s){return String(s).replace(/\D/g,"").slice(-10)}
function fmt(t){return esc("+225 "+String(t==null?"":t).replace(/(\d\d)(?=\d)/g,"$1 "))}
function fcfa(n){return Number(n||0).toLocaleString("fr-FR")+" <small>FCFA</small>"}
function fd(d){return d==today()?"Aujourd’hui":d==tomorrow()?"Demain":d.split("-").reverse().slice(0,2).join("/")}
function sc(id){return D.scores[id]!=null?D.scores[id]:70}
function hm(t){return new Date(t).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
function nk(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim()}
function toast(t){var e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true},2800)}

function av(id,l){var p=pf(id);return '<div class="av'+(l?' lg':'')+'">'+(p&&p.photo?'<img src="'+p.photo+'" alt="">':esc(p?p.name.charAt(0):"?"))+'</div>'}
function vph(id){var v=vh(id);return v&&v.photos.length?'<div class="ph">'+v.photos.map(function(u){return '<img src="'+u+'" alt="Photo du véhicule">'}).join("")+'</div>':''}
function wkb(id){var p=pf(id),w=p&&p.work;if(!w||rl(id)!="conducteur")return"";return '<span class="badge">'+ico("clock",14)+ (w.t=="quotidien"?"Quotidien"+(w.days&&w.days.length?" · "+w.days.map(function(i){return LJ[i]}).join(" "):""):"Occasionnel")+'</span>'}
function fb(id){var p=pf(id),k=rl(id)=="conducteur"?p.dv=="verified":p.idv=="ok";return '<span class="badge '+(k?'b-ok':'b-wait')+'">'+(k?ico("check",14):ico("alert",14))+(rl(id)=="conducteur"?(k?"Vérifié":"En vérification"):(k?"Identité vérifiée":"Identité non vérifiée"))+'</span><span class="badge num">'+ico("star",14)+'Fiabilité '+sc(id)+'/100</span>'+wkb(id)}
function sb(st){var m={attente:["En attente","b-wait","clock"],"acceptée":["Acceptée","b-ok","check"],"refusée":["Refusée","b-red","alert"],"annulée":["Annulée","","alert"],"publié":["Publié","","car"],"en cours":["En cours","b-wait","car"],"terminé":["Terminé","b-ok","check"]}[st]||[st,"","info"];return '<span class="badge '+m[1]+'">'+ico(m[2],14)+m[0]+'</span>'}
function badge2(s){return '<span class="badge '+({g:"b-ok",a:"b-wait",n:""}[s[1]])+'">'+ico(s[1]=="g"?"check":s[1]=="a"?"clock":"alert",14)+s[0]+'</span>'}
function up(l,f,k,m,a){return '<div class="up"><span>'+l+'</span><input type="file" data-f="'+f+'"'+(k?' data-k="'+k+'"':'')+(m?' multiple':'')+' accept="'+a+'"></div>'}
function inp(id,label,val,type,ph,ex){return '<label>'+label+'</label><input id="'+id+'" '+(type?'type="'+type+'" ':'')+'value="'+esc(val==null?"":val)+'" '+(ph?'placeholder="'+ph+'" ':'')+(ex||"")+'>'}

function tripCard(t,btn){
  var d=pf(t.driver),free=t.seats-taken(t.id);
  return '<div class="card"><div class="row"><div class="route">'+esc(t.from)+' → '+esc(t.to)+'</div><div class="price">'+fcfa(t.price)+'</div></div>'+
    '<div class="meta num">'+(t.veh=="Moto"?ico("moto",16):ico("car",16))+' '+t.veh+' · '+fd(t.date)+' à '+t.time+' · '+free+'/'+t.seats+' place'+(free>1?'s':'')+(t.dk!=null?' · à '+dist(t.dk):'')+(t.fcity?' · '+esc(t.fcity):'')+'</div>'+
    '<div class="row rl" style="margin-bottom:6px">'+av(t.driver)+'<div><b>'+esc(d?d.name:"Conducteur")+'</b><div>'+fb(t.driver)+'</div></div></div>'+(btn||"")+'</div>'
}

function head(){
  var m=me(),n=D.notifs.filter(function(x){return x.to==m.id&&!x.r}).length;
  return '<header><div class="logo">T</div><div class="brand">Trajet<b>.</b></div><span class="role">'+{passager:"Passager",conducteur:"Conducteur",admin:"Admin"}[role()]+'</span><button class="bell" data-a="tab" data-t="notif" aria-label="Notifications">'+ico("bell",20)+(n?'<i>'+n+'</i>':'')+'</button></header>'
}
function nav(){
  return '<nav><div>'+TABS[role()].map(function(t){
    return '<button data-a="tab" data-t="'+t+'" class="'+(S.tab==t?"on":"")+'">'+ico(TAB_IC[t]||"car",20)+'<span>'+LBL[t]+'</span></button>'

function hav(a,b,c,d){var R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,z=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(z))}
function gps(hi){return new Promise(function(res){if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,speed:p.coords.speed})},function(){res(null)},{enableHighAccuracy:!!hi,timeout:12000,maximumAge:5000})})}
function cityOf(a){return a.city||a.town||a.village||a.municipality||a.county||a.state_district||""}
async function geo2(q){try{var r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&addressdetails=1&countrycodes=ci&q="+encodeURIComponent(q));var j=await r.json();if(!j[0])return null;return{lat:+j[0].lat,lng:+j[0].lon,city:cityOf(j[0].address||{})}}catch(e){return null}}
async function rev(lat,lng){try{var r=await fetch("https://nominatim.openstreetmap.org/reverse?format=json&zoom=10&addressdetails=1&lat="+lat+"&lon="+lng);var j=await r.json();return cityOf(j.address||{})}catch(e){return ""}}
function geoQ(txt,ms2){var p=geo2(txt);return Promise.race([p,new Promise(function(r){setTimeout(function(){r(null)},ms2||2000)})]).then(function(r){return{r:r,p:p}})}

var TRK={id:null,w:null,last:0};
function startTrack(tid){if(TRK.id==tid||!navigator.geolocation)return;stopTrack();TRK.id=tid;TRK.w=navigator.geolocation.watchPosition(function(p){var n=Date.now();if(n-TRK.last<5000)return;TRK.last=n;SB.from("trip_positions").upsert({trip_id:tid,lat:p.coords.latitude,lng:p.coords.longitude,speed:p.coords.speed,updated_at:new Date().toISOString()}).then(function(){})},function(){toast("Active la localisation")},{enableHighAccuracy:true,maximumAge:3000,timeout:20000})}
function stopTrack(){if(TRK.w!=null&&navigator.geolocation)navigator.geolocation.clearWatch(TRK.w);TRK.w=null;TRK.id=null}
function resumeTrack(){var t=D.trips.filter(function(x){return x.driver==S.u&&x.st=="en cours"})[0];if(t&&role()=="conducteur")startTrack(t.id);else stopTrack()}
function ago(a){var s=Math.max(0,Math.round((Date.now()-a)/1000));return s<60?"il y a "+s+" s":"il y a "+Math.round(s/60)+" min"}
function prog(t){var p=D.pos[t.id];if(!p||t.tlat==null||t.flat==null)return null;var tot=hav(t.flat,t.flng,t.tlat,t.tlng);if(tot<0.05)return null;var rem=hav(p.lat,p.lng,t.tlat,t.tlng);return{p:Math.max(0,Math.min(1,1-rem/tot)),rem:rem,at:p.at,lat:p.lat,lng:p.lng}}
function dist(r){return r<1?Math.round(r*1000)+" m":r.toFixed(1)+" km"}

var activeLeafletMap = null;
function initLiveMap(tId, flat, flng, tlat, tlng, curLat, curLng, isDriver) {
  var el = document.getElementById("leafletMap_" + tId);
  if (!el || typeof L === 'undefined') return;
  if (activeLeafletMap) {
    try { activeLeafletMap.remove(); } catch(e){}
    activeLeafletMap = null;
  }
  var centerLat = curLat != null ? curLat : (flat != null ? flat : 5.3600);
  var centerLng = curLng != null ? curLng : (flng != null ? flng : -4.0083);
  var map = L.map(el, {zoomControl: false}).setView([centerLat, centerLng], 13);
  activeLeafletMap = map;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
  }).addTo(map);

  var markersGroup = [];
  if (flat != null && flng != null) {
    L.marker([flat, flng]).addTo(map).bindPopup("<b>Départ:</b> " + esc(tr(tId).from));
    markersGroup.push([flat, flng]);
  }
  if (tlat != null && tlng != null) {
    L.marker([tlat, tlng]).addTo(map).bindPopup("<b>Arrivée:</b> " + esc(tr(tId).to));
    markersGroup.push([tlat, tlng]);
  }
  if (curLat != null && curLng != null) {
    var redIcon = L.divIcon({
      className: 'custom-live-car',
      html: '<div style="background:#e8383b;color:#fff;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-size:16px;box-shadow:0 4px 12px rgba(232,56,59,0.5);border:2px solid #fff"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16V12l2-5h10l2 5v4"/><path d="M3 16h18"/><circle cx="8" cy="17" r="1.5"/><circle cx="16" cy="17" r="1.5"/></svg></div>',
      iconSize: [32, 32],
      iconAnchor: [16, 16]
    });
    L.marker([curLat, curLng], {icon: redIcon}).addTo(map).bindPopup("<b>Position en direct</b>");
    markersGroup.push([curLat, curLng]);
  }
  if (markersGroup.length > 1) {
    try { map.fitBounds(L.latLngBounds(markersGroup), {padding: [30, 30]}); } catch(e){}
  }
}
