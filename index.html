function rl(id){var r=D.user_roles.filter(function(x){return x.uid==id})[0];return r&&r.role}

function vh(id){return D.vehicles.filter(function(v){return v.uid==id})[0]}
function taken(id){return D.taken[id]||0}
function cl(s){return String(s).replace(/\D/g,"").slice(-10)}

function fd(d){return d==today()?"Aujourd’hui":d.split("-").reverse().slice(0,2).join("/")}

/* ---------- Éléments d’interface ---------- */

function cgu(){return '<h1>Conditions d’utilisation</h1><p class="sub">Dernière mise à jour : novembre 2026</p><div class="card"><p><b>1. Objet.</b> Trajet, éditée par Digitalk Afrique, met en relation des conducteurs (voiture entre villes, moto entre quartiers) et des passagers en Côte d’Ivoire. Trajet est un service d’intermédiation : il n’est pas transporteur.</p><p><b>2. Gratuité.</b> Le service est gratuit et sans commission. Le prix est fixé par le conducteur et réglé directement entre le conducteur et le passager, en dehors de l’application.</p><p><b>3. Compte.</b> Vous devez fournir des informations exactes. Un compte correspond à un seul rôle (passager ou conducteur). Gardez votre mot de passe confidentiel.</p><p><b>4. Conducteurs.</b> Le conducteur doit détenir un permis valide, une assurance et une visite technique à jour pour son véhicule, et respecter le code de la route. Il ne peut publier qu’après validation de son dossier.</p><p><b>5. Passagers.</b> Le passager réserve dans la limite des places disponibles, se présente à l’heure au point de rendez-vous et prévient en cas d’empêchement. Les annulations tardives et les absences réduisent le score de fiabilité.</p><p><b>6. Comportement.</b> Tout comportement abusif, frauduleux ou dangereux peut être signalé. Trajet peut avertir, suspendre ou bannir un compte.</p><p><b>7. Sécurité.</b> Le bouton SOS prévient l’équipe Trajet et facilite l’appel de votre contact d’urgence. Il ne remplace pas les services d’urgence officiels.</p><p><b>8. Responsabilité.</b> Trajet ne garantit ni la ponctualité ni la qualité des trajets et ne peut être tenu responsable des accidents, retards, pertes ou litiges entre utilisateurs, dans la limite permise par la loi.</p><p><b>9. Annonces.</b> L’application peut afficher des annonces publicitaires. Trajet n’est pas responsable du contenu des annonceurs.</p><p><b>10. Données personnelles.</b> Leur traitement est décrit dans la politique de confidentialité.</p><p><b>11. Propriété intellectuelle.</b> © 2026 Digitalk Afrique. Tous droits réservés. L’application Trajet, sa marque et son logo sont la propriété de Digitalk Afrique et ne peuvent être copiés ou réutilisés sans autorisation.</p><p><b>12. Modification et droit applicable.</b> Ces conditions peuvent évoluer ; l’usage continu vaut acceptation. Elles sont soumises au droit ivoirien.</p></div>'}
function foot(li){var a1=li?'data-a="tab" data-t="cgu"':'data-a="pol2"',a2=li?'data-a="tab" data-t="priv"':'data-a="pol1"';return '<p style="text-align:center;font-size:12px;color:var(--mut);margin:32px 0 0">© 2026 Digitalk Afrique. Tous droits réservés.<br><a href="#" '+a1+' style="color:var(--mut)">Conditions d’utilisation</a> · <a href="#" '+a2+' style="color:var(--mut)">Confidentialité</a></p>'}
var LJ=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"],MOT=["Comportement agressif ou irrespectueux","Retard ou absence répétés","Conduite dangereuse","Arnaque ou prix non respecté","Harcèlement","Autre"];
function wkb(id){var p=pf(id),w=p&&p.work;if(!w||rl(id)!="conducteur")return"";return '<span class="badge">'+(w.t=="quotidien"?"Quotidien"+(w.days&&w.days.length?" · "+w.days.map(function(i){return LJ[i]}).join(" "):""):"Occasionnel")+'</span>'}

function route(t){var c=t.veh=="Moto"?"🏍️":"🚕";return '<div class="rt"><span>📍 '+esc(t.from)+'</span><span>'+esc(t.to)+' 🏁</span></div><div class="trk"><i class="car '+(t.st=="en cours"?"go":t.st=="terminé"?"end":"")+'">'+c+'</i></div>'}
function rpForm(){var w=pf(S.rp.who);return '<button class="link" data-a="rpx">← Annuler</button><h1>Signaler</h1><p class="sub">Signalement concernant <b>'+esc(w?w.name:"?")+'</b>. L’équipe Trajet lira votre message et décidera des suites.</p><label>Motif</label><select id="rpm">'+MOT.map(function(x){return '<option>'+x+'</option>'}).join("")+'</select><label>Détails</label><textarea id="rpt" rows="4" maxlength="400" placeholder="Expliquez ce qui s’est passé…" style="width:100%;font:inherit;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)"></textarea><button class="pri full" style="margin-top:16px" data-a="rps">Envoyer le signalement</button>'}
function resets(){var l=D.password_resets.filter(function(r){return r.st=="ouvert"&&pf(r.uid)});return l.length?'<h2 style="margin-top:0">Mots de passe oubliés</h2>'+l.map(function(r){var p=pf(r.uid);return '<div class="card unread"><div class="row"><b>'+esc(p.name)+'</b><span class="meta" style="margin:0">'+fmt(p.tel)+'</span></div><div style="margin:8px 0 2px">'+(r.so===true?'<span class="badge b-ok">Mot secret correct</span>':r.so===false?'<span class="badge b-red">Mot secret INCORRECT</span>':'<span class="badge b-wait">Aucun mot secret défini</span>')+'</div><p class="sub" style="font-size:13px;margin:4px 0 0">Communique le nouveau mot de passe en appelant le numéro enregistré.</p><label>Nouveau mot de passe (6 à 8 chiffres)</label><input id="rp'+r.id+'" inputmode="numeric" maxlength="8" placeholder="Ex. 482915"><div class="btns"><button class="out" data-a="rpno" data-id="'+r.id+'">Ignorer</button><button class="ok" data-a="rpok" data-id="'+r.id+'">Réinitialiser</button></div></div>'}).join(""):''}
function sosCard(m){var s=m.sos;return '<div class="card"><b>Numéro d’urgence (SOS)</b><p class="sub" style="font-size:13px;margin:4px 0 0">Le proche à prévenir en cas d’alerte. Visible uniquement par vous et l’équipe Trajet.</p><label>Nom du contact</label><input id="sosn" placeholder="Maman, frère…" value="'+esc(s?s.name:"")+'"><label>Numéro</label><div class="tel"><b>+225</b><input id="sost" type="tel" inputmode="numeric" placeholder="07 00 00 00 00" value="'+esc(s?s.tel:"")+'"></div><div class="btns"><button class="pri" data-a="sossave">Enregistrer</button>'+(s?'<button class="out" data-a="sosdel">Retirer</button>':'')+'</div></div>'}
function pol(){return '<h1>Confidentialité</h1><div class="card"><p>Trajet est gratuit et sans commission. Le paiement se fait directement entre conducteur et passager, jamais dans l’application.</p><p><b>Données collectées :</b> nom, numéro +225, photo, trajets et réservations. Elles servent uniquement au fonctionnement du service.</p><p><b>Documents et pièce d’identité :</b> stockés dans un espace privé, lisibles uniquement par vous et l’équipe Trajet.</p><p><b>Localisation :</b> avec ton accord, ta position sert à te proposer des trajets proches. Seule ta ville est utilisée pour cela ; la position exacte n’est visible que par toi et l’équipe Trajet. Pendant un trajet, la position du conducteur est partagée avec ses passagers.</p><p><b>Mot secret :</b> il est conservé sous forme chiffrée, il n’est jamais lisible, et sert uniquement à vérifier ton identité en cas de mot de passe oublié.</p><p><b>Visibilité :</b> les passagers voient la photo, le nom, le badge et les photos du véhicule du conducteur. Les conducteurs voient le nom, la photo et la fiabilité du passager.</p><p><b>Suppression :</b> vous pouvez supprimer votre compte à tout moment depuis votre profil.</p></div>'}

function vAuth(){if(S.pol)return '<main><button class="link" data-a="pol0">← Retour</button>'+(S.pol==2?cgu():pol())+'</main>';if(S.auth=="fg")return '<header><div class="logo">T</div><div class="brand">Trajet<b>.</b></div></header><main><button class="link" data-a="mode" data-v="in">← Retour</button><h1>Mot de passe oublié</h1><p class="sub">Entrez votre numéro. L’équipe Trajet sera prévenue et vous communiquera un nouveau mot de passe.</p><label>Numéro de téléphone</label><div class="tel"><b>+225</b><input id="ft" type="tel" inputmode="numeric" placeholder="07 00 00 00 00"></div><label>Mot secret</label><input id="fw" maxlength="6" autocomplete="off" autocapitalize="none" placeholder="Le mot choisi à l’inscription"><p class="sub" style="font-size:13px;margin:6px 0 0">Pas de mot secret défini ? Laisse vide : l’équipe Trajet vérifiera ton identité par téléphone.</p><button class="pri full" style="margin-top:18px" data-a="forgot">Envoyer la demande</button>'+(S.fgdone?'<div class="note" style="margin-top:16px">Demande envoyée. Si ce numéro a un compte, l’équipe Trajet vous contactera avec un nouveau mot de passe.</div>':'')+'</main>';var up=S.auth=="up";
return '<header><div class="logo" data-a="tap">T</div><div class="brand">Trajet<b>.</b></div></header><main><div class="ad bn"><img src="banner.webp" alt="Un Trajet partagé, des économies assurées. Trajet, application de covoiturage sans commission."></div><div class="seg">'+[["in","Connexion"],["up","Inscription"]].map(function(x){return '<button data-a="mode" data-v="'+x[0]+'" class="'+(S.auth==x[0]?"on":"")+'">'+x[1]+'</button>'}).join("")+'</div>'+
(up?'<label>Je suis</label><div class="seg">'+[["passager","Passager"],["conducteur","Conducteur"]].map(function(x){return '<button data-a="role" data-v="'+x[0]+'" class="'+(S.rr==x[0]?"on":"")+'">'+x[1]+'</button>'}).join("")+'</div><p class="sub" style="margin:8px 0 0;font-size:13px">Un compte = un seul rôle.</p><label>Nom complet</label><input id="sn" placeholder="Prénom et nom" autocomplete="name">':'')+
(S.adm&&!up?'<label>E-mail</label><input id="lt" type="email" autocomplete="username" placeholder="nom@exemple.com">':'<label>Numéro de téléphone</label><div class="tel"><b>+225</b><input id="'+(up?"st":"lt")+'" type="tel" inputmode="numeric" placeholder="07 00 00 00 00"></div>')+'<label>Mot de passe'+(up?' (6 à 8 chiffres)':'')+'</label><input id="'+(up?"sp":"lp")+'" type="password"'+(S.adm&&!up?'':' inputmode="numeric" maxlength="8"')+' placeholder="••••••">'+
(up?'<label>Mot secret (5 ou 6 lettres)</label><input id="ss" maxlength="6" autocomplete="off" autocapitalize="none" placeholder="ex. soleil"><p class="sub" style="font-size:13px;margin:6px 0 0">Il prouvera que c’est bien toi si tu oublies ton mot de passe. Ne le partage avec personne.</p>':'')+
(up?'<div class="chk"><input type="checkbox" id="sc"><label for="sc">J’accepte les <a href="#" data-a="pol2" style="color:var(--red)">conditions d’utilisation</a> et la <a href="#" data-a="pol1" style="color:var(--red)">politique de confidentialité</a></label></div>':'')+
'<button class="pri full" style="margin-top:18px" data-a="'+(up?"reg":"login")+'">'+(up?"Créer mon compte":"Se connecter")+'</button>'+(up?'':'<button class="link full" style="margin-top:8px" data-a="fg">Mot de passe oublié ?</button>')+foot()+'</main>'}

var ob=$("ob"),otk=$("obtrack"),dts=ob.querySelectorAll(".dots i"),obi=0;
function obUpd(){Array.prototype.forEach.call(dts,function(d,i){d.className=i==obi?"on":""});$("obnext").textContent=obi==2?"Commencer":"Suivant"}

try{if(localStorage.getItem("trajet_intro")=="1")ob.hidden=true}catch(e){}
function adHtml(){var l=D.ads.filter(function(x){return x.on});if(!l.length)return'<div class="ad bn"><img src="banner.webp" alt="Un Trajet partagé, des économies assurées. Trajet, application de covoiturage sans commission."></div>';var x=l[(S.ai||0)%l.length];return '<div class="ad'+(x.i?'':' tx')+'">'+(x.i?'<img src="'+x.i+'" alt="">':'')+'<small>Annonce</small>'+(x.t||x.x?'<div class="t"><b style="font-size:18px">'+esc(x.t)+'</b><div style="font-size:14px">'+esc(x.x)+'</div></div>':'')+'</div>'}
setInterval(function(){var e=$("ad"),l=D.ads.filter(function(x){return x.on});if(!e||l.length<2)return;var n=Date.now(),c=l[(S.ai||0)%l.length];if(!S.ast)S.ast=n;if(n-S.ast>=Math.min(60,c.d||10)*1000){S.ai=(S.ai||0)+1;S.ast=n;e.innerHTML=adHtml()}},1000);
function vSearch(){var m=me();
if(S.sub=="d"&&tr(S.sel)){var t=tr(S.sel),v=vh(t.driver),b=D.bookings.filter(function(x){return x.trip==t.id&&x.uid==m.id&&(x.st=="attente"||x.st=="acceptée")})[0];
return '<button class="link" data-a="sub" data-s="">← Retour aux trajets</button>'+tripCard(t)+(v?'<div class="card"><b>Véhicule</b><div class="meta" style="margin:4px 0 0">'+esc(v.type)+' · '+esc(v.model||"")+'</div>'+vph(t.driver)+'</div>':'')+(b?'<div class="card"><b>Votre réservation</b><div style="margin-top:8px">'+sb(b.st)+'</div></div>':(function(){var l=t.seats-taken(t.id),n=Math.min(Math.max(1,S.pl||1),l);return '<div class="card"><div class="row"><b>Nombre de places</b><span class="row rl"><button data-a="plm">−</button><b style="min-width:24px;text-align:center">'+n+'</b><button data-a="plp">+</button></span></div><div class="meta" style="margin:8px 0 0">'+l+' disponible(s) · Total : '+n*t.price+' FCFA</div></div><button class="pri full" data-a="book" data-id="'+t.id+'">Réserver '+n+' place'+(n>1?'s':'')+'</button>'})()+'<p class="sub" style="margin-top:10px;font-size:13px">Vous payez le conducteur directement, en main propre.</p>')}
return '<div id="ad">'+adHtml()+'</div><h1>Où allez-vous ?</h1><p class="sub">Recherchez un trajet et réservez votre place.</p><button class="out full" style="margin-bottom:6px" data-a="rqo">Proposer mon trajet et mon prix</button><label>Départ</label><input id="qf" data-s="1" placeholder="Nimbo, Cocody, Abidjan…" value="'+esc(S.q.f)+'"><label>Destination</label><input id="qt" data-s="1" placeholder="INFAS, Yopougon, Bouaké…" value="'+esc(S.q.t)+'"><label>Date</label><input type="date" id="qd" data-s="1" value="'+S.q.d+'"><label>Type de véhicule</label><div class="seg">'+[["all","Tous"],["Voiture","Voiture"],["Moto","Moto"]].map(function(x){return '<button data-a="veh" data-v="'+x[0]+'" class="'+(S.q.v==x[0]?"on":"")+'">'+x[1]+'</button>'}).join("")+'</div>'+filtBar()+'<h2>Trajets disponibles</h2><div id="tl">'+tl()+'</div>'}

/* ---------- Géolocalisation, suivi en direct ---------- */
function hav(a,b,c,d){var R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,z=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(z))}
function gps(hi){return new Promise(function(res){if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,speed:p.coords.speed})},function(){res(null)},{enableHighAccuracy:!!hi,timeout:12000,maximumAge:5000})})}
async function geo(q){try{var r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ci&q="+encodeURIComponent(q));var j=await r.json();return j[0]?{lat:+j[0].lat,lng:+j[0].lon}:null}catch(e){return null}}
var TRK={id:null,w:null,last:0};
function startTrack(tid){if(TRK.id==tid||!navigator.geolocation)return;stopTrack();TRK.id=tid;TRK.w=navigator.geolocation.watchPosition(function(p){var n=Date.now();if(n-TRK.last<5000)return;TRK.last=n;SB.from("trip_positions").upsert({trip_id:tid,lat:p.coords.latitude,lng:p.coords.longitude,speed:p.coords.speed,updated_at:new Date().toISOString()}).then(function(){})},function(){toast("Active la localisation pour que les passagers te suivent")},{enableHighAccuracy:true,maximumAge:3000,timeout:20000})}
function stopTrack(){if(TRK.w!=null&&navigator.geolocation)navigator.geolocation.clearWatch(TRK.w);TRK.w=null;TRK.id=null}
function resumeTrack(){var t=D.trips.filter(function(x){return x.driver==S.u&&x.st=="en cours"})[0];if(t&&role()=="conducteur")startTrack(t.id);else stopTrack()}
function ago(a){var s=Math.max(0,Math.round((Date.now()-a)/1000));return s<60?"il y a "+s+" s":"il y a "+Math.round(s/60)+" min"}
function prog(t){var p=D.pos[t.id];if(!p||t.tlat==null||t.flat==null)return null;var tot=hav(t.flat,t.flng,t.tlat,t.tlng);if(tot<0.05)return null;var rem=hav(p.lat,p.lng,t.tlat,t.tlng);return{p:Math.max(0,Math.min(1,1-rem/tot)),rem:rem,at:p.at,lat:p.lat,lng:p.lng}}
function dist(r){return r<1?Math.round(r*1000)+" m":r.toFixed(1)+" km"}
function carLeft(p){return "calc("+(p*100)+"% - "+(p*28)+"px)"}
function live(t){var c=t.veh=="Moto"?"🏍️":"🚕",g=prog(t),pr=t.st=="terminé"?1:(t.st=="en cours"&&g?g.p:0),info="";
if(t.st=="en cours")info=g?"À "+dist(g.rem)+" de l’arrivée · "+ago(g.at):"En attente de la position du conducteur…";
return '<div class="rt"><span>📍 '+esc(t.from)+'</span><span>'+esc(t.to)+' 🏁</span></div><div class="trk"><i class="car" id="car'+t.id+'" style="left:'+carLeft(pr)+';transition:left 4s linear">'+c+'</i></div>'+(info?'<div class="meta" id="lvt'+t.id+'" style="margin:2px 0 0">'+info+'</div>':'')+(g?'<a class="link" style="display:inline-block" target="_blank" rel="noopener" href="https://www.google.com/maps?q='+g.lat+','+g.lng+'">Voir sur la carte</a>':'')}
async function refreshLive(){if(!S.u||busy||document.hidden||!document.querySelector("[id^=car]"))return;var r=await SB.from("trip_positions").select("*");if(r.error)return;D.pos={};r.data.forEach(function(x){D.pos[x.trip_id]={lat:x.lat,lng:x.lng,at:ms(x.updated_at)}});
D.trips.forEach(function(t){var e=$("car"+t.id);if(!e||t.st!="en cours")return;var g=prog(t);if(!g)return;e.style.left=carLeft(g.p);var x=$("lvt"+t.id);if(x)x.textContent="À "+dist(g.rem)+" de l’arrivée · "+ago(g.at)})}
setInterval(function(){refreshLive().catch(function(){})},5000);
