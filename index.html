<style>
:root{
  --bg:#f2f4f8;--card:rgba(255,255,255,0.88);--solid:#ffffff;--soft:#e6e9f0;--ink:#0d0f14;--mut:#646a7a;--line:rgba(13,15,20,0.08);
  --accent:#e8383b;--accent-glow:rgba(232,56,59,0.28);--accent-soft:rgba(232,56,59,0.12);
  --ok:#10b981;--ok-soft:rgba(16,185,129,0.14);
  --warn:#f59e0b;--warn-soft:rgba(245,158,11,0.14);
  --glass:blur(22px) saturate(160%);
  --shadow:0 12px 40px rgba(0,0,0,0.08);
  color-scheme:light;box-sizing:border-box;
}
:root[data-theme="dark"]{
  --bg:#090a0f;--card:rgba(20,23,32,0.82);--solid:#13161f;--soft:#1c202d;--ink:#f5f7fa;--mut:#8b93a7;--line:rgba(255,255,255,0.08);
  --accent:#ff3b3f;--accent-glow:rgba(255,59,63,0.32);--accent-soft:rgba(255,59,63,0.15);
  --ok:#34d399;--ok-soft:rgba(52,211,153,0.14);
  --warn:#fbbf24;--warn-soft:rgba(251,191,36,0.14);
  --shadow:0 16px 48px rgba(0,0,0,0.55);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,sans-serif;overflow-x:hidden}
.num{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.app{width:100%;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:100px;position:relative}

@media(min-width: 481px) {
  body { background: #050608; display: flex; justify-content: center; }
  .app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); box-shadow: 0 0 60px rgba(0,0,0,0.7); min-height: 100vh; }
  nav { max-width: 452px !important; left: 50% !important; transform: translateX(-50%); }
}

header{position:sticky;top:0;z-index:25;background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 12px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;box-shadow:0 0 18px var(--accent-glow);flex:none}
.brand{font-size:20px;font-weight:800;letter-spacing:-0.6px;white-space:nowrap}.brand b{color:var(--accent)}
.role-pill{margin-left:auto;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;background:var(--soft);color:var(--mut);padding:5px 10px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.icon-btn{position:relative;background:var(--soft);border:1px solid var(--line);color:var(--ink);padding:0;width:38px;height:38px;min-height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.icon-btn i{position:absolute;top:-3px;right:-3px;background:var(--accent);color:#fff;font:700 10px/16px sans-serif;min-width:16px;border-radius:99px;font-style:normal;padding:0 4px}

nav{position:fixed;bottom:14px;left:14px;right:14px;z-index:25;pointer-events:none}
nav div{pointer-events:auto;width:100%;margin:0 auto;background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:24px;padding:6px;display:flex;gap:4px;box-shadow:var(--shadow)}
nav button{flex:1;background:transparent;font-size:11px;font-weight:700;padding:8px 2px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:48px;border-radius:18px;transition:all .2s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav button.on{background:var(--accent);color:#fff;box-shadow:0 4px 16px var(--accent-glow)}

main{padding:16px;width:100%;overflow-x:hidden}
h1{font-size:24px;font-weight:800;margin:4px 0 4px;letter-spacing:-0.6px}
h2{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--mut);margin:22px 0 10px}
p.sub{color:var(--mut);margin:0 0 16px;font-size:13.5px}

.swipe-wrap{position:relative;overflow:hidden;border-radius:22px;margin-bottom:12px;width:100%}
.swipe-card{background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:22px;padding:16px;position:relative;z-index:2;transition:transform 0.2s cubic-bezier(0.2,0.8,0.2,1);box-shadow:var(--shadow);width:100%}
.swipe-action{position:absolute;inset:0;background:#dc2626;color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:24px;font-weight:700;font-size:14px;border-radius:22px;z-index:1;gap:8px}

.card{background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);width:100%;overflow:hidden}
.route{font-size:16px;font-weight:800;letter-spacing:-0.3px;display:flex;align-items:center;gap:8px;word-break:break-word;flex:1;min-width:0}
.meta{color:var(--mut);font-size:13px;margin:6px 0 10px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;word-break:break-word}
.price{color:var(--ink);font-weight:800;font-size:17px;white-space:nowrap;flex:none}
.price small{color:var(--accent);font-size:11px;font-weight:700}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;width:100%}.rl{justify-content:flex-start}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--mut);border:1px solid var(--line);white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.b-wait{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.b-red{background:var(--accent-soft);color:var(--accent);border-color:transparent}

button{font:inherit;font-weight:700;border:0;border-radius:16px;padding:12px 16px;cursor:pointer;background:var(--soft);color:var(--ink);min-height:46px;transition:transform .12s,background .15s}
button:active:not(:disabled){transform:scale(0.97)}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--accent);color:#fff;box-shadow:0 6px 20px var(--accent-glow)}
button.ok{background:var(--ok);color:#090a0f}
button.out{background:transparent;border:1px solid var(--line);color:var(--ink)}
button.sos{background:#dc2626;color:#fff;width:100%;box-shadow:0 6px 20px rgba(220,38,38,0.35)}
button.full{width:100%}
.btns{display:flex;gap:8px;margin-top:12px;width:100%}.btns>button{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:10px 8px}
.link{background:none;color:var(--accent);padding:6px 0;min-height:0;font-size:13.5px;display:inline-flex;align-items:center;gap:4px}

label{display:block;font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--mut);margin:14px 0 6px}
input,select,textarea{width:100%;min-width:0;font:inherit;padding:13px 14px;border-radius:16px;border:1px solid var(--line);background:var(--solid);color:var(--ink);transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.swap-wrap{position:relative}
.swap-btn{position:absolute;right:10px;bottom:6px;width:36px;height:36px;min-height:36px;padding:0;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center}

.seg{display:flex;gap:4px;background:var(--solid);padding:4px;border-radius:16px;border:1px solid var(--line);overflow-x:auto;width:100%}
.seg button{flex:1;background:transparent;padding:8px 10px;min-height:38px;white-space:nowrap;font-size:13px;border-radius:12px;color:var(--mut)}
.seg button.on{background:var(--soft);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;width:100%}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:7px 14px;min-height:34px;border-radius:99px;font-size:13px;border:1px solid var(--line);background:var(--solid);color:var(--mut);white-space:nowrap}
.chips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

.hero-map-wrap{position:relative;height:220px;border-radius:24px;overflow:hidden;margin-bottom:14px;border:1px solid var(--line);box-shadow:var(--shadow);width:100%}
#heroMap{width:100%;height:100%;z-index:1}
.hero-overlay{position:absolute;inset:auto 12px 12px 12px;z-index:5;background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.map-box{width:100%;height:210px;border-radius:18px;overflow:hidden;margin:12px 0;border:1px solid var(--line);z-index:1}

.cyber-dest{display:flex;align-items:center;gap:14px;width:100%;background:var(--solid);border:1px solid var(--line);border-radius:20px;padding:16px;font-size:16px;margin-bottom:12px;box-shadow:var(--shadow);text-align:left}
.cyber-dest .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);flex:none}
.cyber-dest b{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;width:100%}
.mode-card{background:var(--solid);border:1px solid var(--line);border-radius:18px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:86px}
.mode-card.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.mode-card b{font-size:12.5px}.mode-card small{font-size:10.5px;color:var(--mut)}

.ad{position:relative;border-radius:18px;overflow:hidden;margin-bottom:14px;background:var(--solid);border:1px solid var(--line);padding:14px 16px;width:100%}
.ad img{width:100%;max-height:110px;object-fit:cover;border-radius:12px;margin-bottom:8px;display:block}
.ad small{font-size:10px;text-transform:uppercase;letter-spacing:0.8px;color:var(--mut);font-weight:700}

.pavw{position:relative;width:96px;margin:8px auto 12px}
.pav{position:relative;display:grid;place-items:center;width:96px;height:96px;border-radius:50%;background:var(--soft);overflow:hidden;cursor:pointer;border:2px solid var(--line)}
.pav img{width:100%;height:100%;object-fit:cover}.pav input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.pavb{position:absolute;right:0;bottom:0;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:16px;font-weight:800;border:2px solid var(--bg)}
.pname{font-size:22px;font-weight:800;text-align:center;letter-spacing:-0.4px;word-break:break-word}
.pphone{text-align:center;color:var(--mut);margin-bottom:10px;font-size:13.5px}

.telemetry{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0;width:100%}
.tel-box{background:var(--solid);border:1px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center}
.tel-box b{display:block;font-size:16px;color:var(--ink);overflow:hidden;text-overflow:ellipsis}.tel-box span{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:0.4px}

.grp{background:var(--solid);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:14px;width:100%}
.row2{display:flex;align-items:center;gap:14px;width:100%;background:none;border-radius:0;padding:14px 16px;text-align:left;min-height:56px}
.grp .row2+.row2{border-top:1px solid var(--line)}
.row2 .ri{flex:none;display:grid;place-items:center;width:28px;color:var(--mut)}.row2 .rt2{flex:1;min-width:0}
.row2 .rt2 b{display:block;font-weight:700;font-size:14.5px}.row2 .rt2 small{display:block;color:var(--mut);font-size:12.5px}.row2 .ch{color:var(--mut)}

.empty{border:1px dashed var(--line);border-radius:20px;padding:28px 16px;text-align:center;color:var(--mut);font-size:14px;width:100%}
.note{background:var(--warn-soft);color:var(--warn);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:13px;font-weight:600;width:100%}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:700;z-index:40;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.4)}
.av{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none}.av img{width:100%;height:100%;object-fit:cover}.av.lg{width:60px;height:60px;font-size:22px}
.ph{display:flex;gap:8px;overflow-x:auto;margin-top:10px;width:100%}.ph img{width:92px;height:68px;object-fit:cover;border-radius:12px;flex:none;border:1px solid var(--line)}
.doc{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px dashed var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;width:100%}.doc.done{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.up{position:relative;overflow:hidden;display:inline-block;flex:none}.up input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}.up span{display:inline-block;background:var(--soft);border:1px solid var(--line);padding:9px 14px;border-radius:12px;font-weight:700;font-size:13px;color:var(--ink)}
.tel{display:flex;gap:8px;width:100%}.tel b{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:13px 12px;display:grid;place-items:center;flex:none}.unread{border-color:var(--accent)}
.chk{display:flex;gap:10px;align-items:center;margin:14px 0;width:100%}.chk label{margin:0;font-weight:400;font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink)}

.msgs{display:flex;flex-direction:column;gap:8px;min-height:42vh;padding-bottom:16px;width:100%}
.bub{max-width:82%;padding:10px 14px;border-radius:18px;background:var(--solid);border:1px solid var(--line);align-self:flex-start;word-break:break-word}
.bub.me{align-self:flex-end;background:var(--accent);color:#fff;border-color:var(--accent)}
.bub small{display:block;font-size:10.5px;opacity:.7;margin-top:3px}.bub audio{max-width:220px;height:36px}
.cbar{position:sticky;bottom:82px;display:flex;gap:8px;align-items:center;background:var(--bg);padding:10px 0;border-top:1px solid var(--line);width:100%}
.cbar input{flex:1}.cbar button{flex:none}.rec{flex:1;font-weight:700;color:var(--accent)}
.rt{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;margin-top:10px;width:100%}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--solid)!important;color:var(--ink)!important;border-radius:12px!important}
</style>
</head>

function hav(a,b,c,d){var R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,z=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(z))}
function gps(hi){return new Promise(function(res){if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy})},function(){res(null)},{enableHighAccuracy:!!hi,timeout:10000,maximumAge:5000})})}
function cityOf(a){return a.city||a.town||a.village||a.municipality||a.county||""}
async function geo2(q){try{var r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&addressdetails=1&countrycodes=ci&q="+encodeURIComponent(q));var j=await r.json();if(!j[0])return null;return{lat:+j[0].lat,lng:+j[0].lon,city:cityOf(j[0].address||{})}}catch(e){return null}}
async function rev(lat,lng){try{var r=await fetch("https://nominatim.openstreetmap.org/reverse?format=json&zoom=10&addressdetails=1&lat="+lat+"&lon="+lng);var j=await r.json();return cityOf(j.address||{})}catch(e){return ""}}
function geoQ(txt,ms2){var p=geo2(txt);return Promise.race([p,new Promise(function(r){setTimeout(function(){r(null)},ms2||2000)})]).then(function(r){return{r:r,p:p}})}

var TRK={id:null,w:null,last:0};
function startTrack(tid){if(TRK.id==tid||!navigator.geolocation)return;stopTrack();TRK.id=tid;TRK.w=navigator.geolocation.watchPosition(function(p){var n=Date.now();if(n-TRK.last<5000)return;TRK.last=n;SB.from("trip_positions").upsert({trip_id:tid,lat:p.coords.latitude,lng:p.coords.longitude,speed:p.coords.speed,updated_at:new Date().toISOString()}).then(function(){})},function(){},{enableHighAccuracy:true,maximumAge:3000,timeout:20000})}
function stopTrack(){if(TRK.w!=null&&navigator.geolocation)navigator.geolocation.clearWatch(TRK.w);TRK.w=null;TRK.id=null}
function resumeTrack(){var t=D.trips.filter(function(x){return x.driver==S.u&&x.st=="en cours"})[0];if(t&&role()=="conducteur")startTrack(t.id);else stopTrack()}
function ago(a){var s=Math.max(0,Math.round((Date.now()-a)/1000));return s<60?"il y a "+s+" s":"il y a "+Math.round(s/60)+" min"}
function prog(t){var p=D.pos[t.id];if(!p||t.tlat==null||t.flat==null)return null;var tot=hav(t.flat,t.flng,t.tlat,t.tlng);if(tot<0.05)return null;var rem=hav(p.lat,p.lng,t.tlat,t.tlng);return{p:Math.max(0,Math.min(1,1-rem/tot)),rem:rem,at:p.at,lat:p.lat,lng:p.lng}}
function dist(r){return r<1?Math.round(r*1000)+" m":r.toFixed(1)+" km"}

var heroMapInstance = null;
function initHeroMap(lat, lng){

  var map = L.map(el, {zoomControl:false, attributionControl:false}).setView([cLat, cLng], 13);
  heroMapInstance = map;
  L.tileLayer(tileLayerUrl(), {maxZoom:19}).addTo(map);
  var pulseIcon = L.divIcon({
    className:'cyber-pulse',
    html:'<div style="width:16px;height:16px;border-radius:50%;background:#ff3b3f;border:3px solid #fff;box-shadow:0 0 18px #ff3b3f"></div>',
    iconSize:[16,16], iconAnchor:[8,8]
  });

}

var activeMaps = {};
function initLiveMap(tId, flat, flng, tlat, tlng, curLat, curLng) {
  var el = document.getElementById("leafletMap_" + tId);
  if (!el || typeof L === 'undefined') return;
  if (activeMaps[tId]) { try { activeMaps[tId].remove(); } catch(e){} delete activeMaps[tId]; }
  var cLat = curLat != null ? curLat : (flat != null ? flat : 5.3600);
  var cLng = curLng != null ? curLng : (flng != null ? flng : -4.0083);
  var map = L.map(el, {zoomControl: false, attributionControl: false}).setView([cLat, cLng], 13);
  activeMaps[tId] = map;
  L.tileLayer(tileLayerUrl(), {maxZoom: 19}).addTo(map);

  var pts = [];
  if (flat != null && flng != null) { L.marker([flat, flng]).addTo(map).bindPopup("Départ"); pts.push([flat, flng]); }
  if (tlat != null && tlng != null) { L.marker([tlat, tlng]).addTo(map).bindPopup("Arrivée"); pts.push([tlat, tlng]); }
  if (curLat != null && curLng != null) {
    var cabIcon = L.divIcon({
      className: 'cyber-cab-marker',
      html: '<div style="background:#ff3b3f;color:#fff;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;box-shadow:0 0 16px #ff3b3f;border:2px solid #fff">'+ico("car",16,"#fff")+'</div>',
      iconSize: [30, 30], iconAnchor: [15, 15]
    });
    L.marker([curLat, curLng], {icon: cabIcon}).addTo(map).bindPopup("Véhicule en direct");
    pts.push([curLat, curLng]);
  }
  if (pts.length > 1) { try { map.fitBounds(L.latLngBounds(pts), {padding: [28, 28]}); } catch(e){} }
}

return '<div class="chips"><button data-a="'+act+'" data-v="" class="'+(!cur?"on":"")+'">Toutes</button>'+a.map(function(c){return '<button data-a="'+act+'" data-v="'+esc(c.k)+'" class="'+(cur==c.k?"on":"")+'">'+esc(c.n)+' ('+c.c+')</button>'}).join("")+'</div>'}

function tl(){
  var q=S.q,m=me(),ck=S.city||"",so=S.sort||(m&&m.lat!=null?"prox":"heure");
  var l=D.trips.filter(function(t){
    return t.st=="publié"&&t.seats-taken(t.id)>0&&
      (!q.f||nk(t.from).indexOf(nk(q.f))>-1)&&
      (!q.t||nk(t.to).indexOf(nk(q.t))>-1)&&
      (!q.d||t.date==q.d)&&
      (q.v=="all"||t.veh==q.v)&&
      (!ck||nk(t.fcity)==ck||nk(t.from)==ck)

  if (!activeSwipeCard) return;
  touchCurrentX = e.touches[0].clientX;
  var diff = touchCurrentX - touchStartX;
  if (diff < 0) {
    activeSwipeCard.style.transform = 'translateX(' + Math.max(diff, -110) + 'px)';
  }
};

window.handleTouchEnd = function(e, type, id) {
  if (!activeSwipeCard) return;
  activeSwipeCard.style.transition = 'transform 0.2s cubic-bezier(0.2,0.8,0.2,1)';
  var diff = touchCurrentX - touchStartX;
  if (diff < -70) {
    activeSwipeCard.style.transform = 'translateX(-110px)';
    setTimeout(function() {
      if (type === 'notif') {
        S.hiddenNotifs.push(id);
        toast("Notification masquée");
      } else if (type === 'trip') {
        S.hiddenTrips.push(id);
        toast("Trajet masqué de l'historique");
      }
      render();
    }, 180);
  } else {
    activeSwipeCard.style.transform = 'translateX(0px)';
  }
  activeSwipeCard = null;
  touchStartX = 0;
  touchCurrentX = 0;
};

  var rr;try{rr=f(b.dataset,id)}catch(x){toast(x.message);return}
  if(rr&&rr.then){
    busy=1;rr.then(function(){return S.u?load(f.r):0}).then(guardBan).catch(function(x){toast(x&&x.message?x.message:"Erreur")}).then(function(){busy=0;render();if(f.after&&S.u)bg(ALLP.filter(function(p){return p!="people"}))})
  }else render()
});

document.addEventListener("input",function(e){
  var t=e.target,m=me();
  if(t.dataset.k&&m){var v=vh(m.id);if(v&&role()=="conducteur"){v[t.dataset.k]=t.value;clearTimeout(vt);vt=setTimeout(function(){saveV().catch(function(){})},700)}}
  if(t.dataset.ad&&role()=="admin"){S.ad=S.ad||{t:"",x:"",i:""};S.ad[t.dataset.ad]=t.value}
  if(t.dataset.s&&$("tl")){S.q.f=$("qf").value;S.q.t=$("qt").value;S.q.d=$("qd").value;$("tl").innerHTML=tl()}
});

document.addEventListener("change",async function(e){
  var t=e.target,f=t.dataset.f,m=me();if(!f||!t.files.length||!m||busy)return;busy=1;
  try{
    var F=t.files[0],k=t.dataset.k,isImg=/^image/.test(F.type),ext=(F.name.split(".").pop()||"jpg").toLowerCase();
    var up1=async function(bucket,path,file){var b=file,ct=file.type||"application/octet-stream";if(/^image/.test(ct)){b=await rb(file);ct="image/jpeg"}ok(await SB.storage.from(bucket).upload(path,b,{contentType:ct,upsert:true}));return b};
    if(f=="ad"){S.ad=S.ad||{t:"",x:"",i:""};S.ad.b=await rb(F);S.ad.i=URL.createObjectURL(S.ad.b)}
    else if(f=="pp"){var p1=S.u+"/avatar_"+Date.now()+".jpg";await up1("avatars",p1,F);ok(await SB.from("profiles").update({photo_path:p1}).eq("id",S.u));toast("Photo de profil mise à jour")}
    else if(f=="vp"){var v=vh(S.u);v.paths=(v.paths||[]).slice();for(var i=0;i<t.files.length;i++){var pp=S.u+"/"+Date.now()+"-"+i+".jpg";await up1("vehicles",pp,t.files[i]);v.paths.push(pp)}await saveV();toast("Photos ajoutées")}
    else if(f=="pid"){var p2=S.u+"/identite_"+Date.now()+"."+(isImg?"jpg":ext);await up1("documents",p2,F);ok(await SB.from("profiles").update({id_doc_path:p2,id_status:"review"}).eq("id",S.u));toast("Identité envoyée")}
    else if(f=="doc"){var p3=S.u+"/"+k+"_"+Date.now()+"."+(isImg?"jpg":ext);await up1("documents",p3,F);ok(await SB.from("driver_documents").upsert({user_id:S.u,kind:k,file_path:p3,file_name:F.name},{onConflict:"user_id,kind"}));toast("Document ajouté")}
    if(f!="ad")await load(f=="vp"||f=="doc"?["veh"]:["people"])
  }catch(err){toast(err&&err.message?err.message:"Échec de l’envoi")}
  busy=0;render()
});

setInterval(async function(){
  if(!S.u||document.hidden||busy)return;
  if(document.querySelector("[id^=leafletMap_]")){
    var r=await SB.from("trip_positions").select("*");
    if(!r.error){D.pos={};r.data.forEach(function(x){D.pos[x.trip_id]={lat:x.lat,lng:x.lng,at:ms(x.updated_at)}});D.trips.forEach(function(t){if(t.st=="en cours"&&$("leafletMap_"+t.id)){var g=prog(t);if(g){initLiveMap(t.id,t.flat,t.flng,t.tlat,t.tlng,g.lat,g.lng);var x=$("lvt"+t.id);if(x)x.textContent="À "+dist(g.rem)+" de l’arrivée · "+ago(g.at)}}})}
  }
},6000);

if(location.hash=="#gestion")S.adm=1;
(async function(){try{var s=(await SB.auth.getSession()).data.session;if(s){S.u=s.user.id;await load(["people"]);await guardBan();if(S.u){render();await load(ALLP.filter(function(p){return p!="people"}))}}}catch(e){S.u=null}render()})();
</script>
